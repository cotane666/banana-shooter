plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bananashooter.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.bananashooter.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so `assembleRelease` works out of the box
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game is a single self-contained HTML file plus icons
    aaptOptions {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
