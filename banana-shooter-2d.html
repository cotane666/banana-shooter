/* ============================================================
   BANANA SHOOTER 2D — интерфейс и стили

* { margin: 0; padding: 0; box-sizing: border-box; }

const MATCH = window.MATCH = {

  mapName(id) {
    const m = (typeof mapById === 'function') ? mapById(id) : null;
    return m ? m.name : 'АРЕНА';
  },
  clampPlayers(n, online) {
    n = Math.round(n || 2);
    const lo = online ? 2 : 1;
    return U.clamp(n, lo, MATCH.maxPlayers);
  },
  /* онлайн: матч идёт ДО N ПОБЕД (а не до N сыгранных раундов). Любое число. */
  clampRounds(n) {
    n = Math.round(n || 1);
    return U.clamp(n, 1, 99);
  },
  /* custom offline mode: how many zombies and how tough they are */
  countOptions: [1, 2, 5, 10, 20],
  hpOptionsOff: [0.25, 0.5, 1, 2, 5],

  /* which shop categories a room allows (host picks it in the lobby; only
     enforced in ONLINE matches). Built from BUY_CATS at call time. */
  defaultShopAllow() {
    const o = {};
    (typeof BUY_CATS !== 'undefined' ? BUY_CATS : []).forEach(c => { o[c.id] = 1; });
    return o;
  },
  /* every individual buyable in the shop, grouped by category. Weapons with a
     price plus all gear. Used for the per-item allow-list. */
  shopItems() {
    const out = {};
    if (typeof BUY_CATS === 'undefined') return out;
    BUY_CATS.forEach(c => { out[c.id] = []; });
    if (typeof WEAPONS !== 'undefined') {
      for (const id in WEAPONS) {
        const w = WEAPONS[id];
        if (w.price > 0 && out[w.cat]) out[w.cat].push({ id: id, name: w.name });
      }
    }
    if (typeof GEAR !== 'undefined' && out.gear) {
      for (const id in GEAR) out.gear.push({ id: id, name: GEAR[id].name });
    }
    return out;
  },
  /* per-item allow map; missing = allowed */
  defaultItemAllow() { return {}; }
};

/* compound accuracy goals: a minimum number of shots AND an accuracy % */
const ACH_ACC = {
  m_acc40: { shots: 200, acc: 40 }, h_acc55: { shots: 400, acc: 55 }, v_acc70: { shots: 600, acc: 70 }
};
/* returns { have, goal, frac } for one achievement against a live stats snapshot */
function achProgress(a, s) {
  if (!a || !s) return { have: 0, goal: 1, frac: 0 };
  const acc = ACH_ACC[a.id];
  if (acc) {
    const shots = s.shots || 0, pct = s.accuracy || 0;
    const have = Math.min(shots / acc.shots, pct / acc.acc);
    return { have: Math.round(have * acc.shots), goal: acc.shots, frac: U.clamp(have, 0, 1), label: Math.round(pct) + '% / ' + acc.acc + '%' };
  }
  /* «быстрое прохождение» — цель по времени: пока не пройдено, показываем отсчёт
     от лимита (чем меньше времени, тем больше прогресс) */
  if (a.id === 'x_speedrun') {
    const have = s.fastClear || 0, goal = 1;
    return { have: have, goal: goal, frac: have >= 1 ? 1 : 0 };
  }
  /* НЕОСТОРОЖНЫЙ: нужно И выстрелить много, И много промазать — берём минимум долей */
  if (a.id === 'm_score25k') {
    const shots = s.shots || 0, misses = s.misses || 0;
    const frac = Math.min(shots / 5000, misses / 4000);
    return { have: Math.min(shots, misses), goal: 4000, frac: U.clamp(frac, 0, 1), label: Math.round(misses) + ' промахов' };
  }
  /* финальное платиновое достижение: прогресс = доля ВЫПОЛНЕННЫХ остальных */
  if (a.id === 'platinum_all') {
    const done = s.otherDone || 0, total = s.otherTotal || 1;
    return { have: done, goal: total, frac: U.clamp(done / total, 0, 1) };
  }
  const spec = ACH_PROGRESS[a.id];
  if (!spec) return { have: 0, goal: 1, frac: 0 };
  const have = Math.max(0, s[spec[0]] || 0), goal = spec[1];
  return { have: have, goal: goal, frac: U.clamp(have / goal, 0, 1) };
}
/* a short "1 234 / 5 000" style label for the progress readout */
function achProgressText(have, goal) {
  const f = n => Math.round(n).toLocaleString('ru-RU');
  return f(have) + ' / ' + f(goal);
}
/* how many achievements (excluding the platinum one) are done, and whether all
   of them are — the condition behind the final platinum reward. */
function achOtherDone(ach) {
  ach = ach || {};
  let n = 0;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    if (a.id === 'platinum_all' || a.mech) continue;   // мех-скины не влияют на платину
    if (ach[a.id]) n++;
  }
  return n;
}
function achOtherTotal() {
  let n = 0;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    if (a.id === 'platinum_all' || a.mech) continue;
    n++;
  }
  return n;
}
function achAllOthersDone(ach) {
  return achOtherDone(ach) >= achOtherTotal();
}

function _hexToHsl(hex) {
  const r = ((hex >> 16) & 255) / 255, g = ((hex >> 8) & 255) / 255, b = (hex & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0, s = 0, l = (mx + mn) / 2;
  if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; }
  return [h, s, l];
}

<script>
/* ============================================================
   05 — AUDIO (WebAudio, fully synthesised — no asset files)

const Audio3D_SFX = {
  ctx: null, master: null, sfx: null, musicBus: null, muted: false, vol: .6, sfxVol: 1, musicVol: 1,
  listener: { x: 0, y: 0, z: 0, fx: 0, fz: -1 },

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    // master (overall) -> destination; two sub-buses so effects and music can
    // be balanced (or muted) independently of each other
    this.master = this.ctx.createGain();
    this.master.gain.value = this.vol;
    this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain();
    this.sfx.gain.value = this.sfxVol;
    this.sfx.connect(this.master);
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = this.musicVol;
    this.musicBus.connect(this.master);
    this.noiseBuf = this._makeNoise(1.0);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  setSfxVol(v) { this.sfxVol = v; if (this.sfx) this.sfx.gain.value = v; },
  setMusicVol(v) { this.musicVol = v; if (this.musicBus) this.musicBus.gain.value = v; },
  setListener(x, y, z, fx, fz) { this.listener.x = x; this.listener.y = y; this.listener.z = z; this.listener.fx = fx; this.listener.fz = fz; },

    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },

  /* volume/pan/attenuation for a world-positioned sound */
  _spatial(x, y, z, refDist, maxDist) {
    if (x === undefined) return { gain: 1, pan: 0 };

    const dx = x - L.x, dy = y - L.y, dz = z - L.z;

    const pan = U.clamp((dx * right.x + dz * right.z) / Math.max(dist, .3), -1, 1) * .85;

  /* ---------- laser cannon ---------- */
  /* charging whirr as the barrel winds up — БАСОВЫЙ, не писклявый */
  cannonSpin(x, y, z) {

    if (sp.gain <= .002) return;

    o.frequency.exponentialRampToValueAtTime(190, t + .5);

    g.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(lp); lp.connect(g); g.connect(out);

    const sub = this.ctx.createOscillator(); sub.type = 'sine';
    sub.frequency.setValueAtTime(36, t);

    const sg = this.ctx.createGain();
    sg.gain.setValueAtTime(.20, t);
    sg.gain.exponentialRampToValueAtTime(.001, t + .6);
    sub.connect(sg); sg.connect(out);

  /* the beam itself: a sustained laser whine that RISES over time.
     `heat` (0..1) is the fraction of the beam's burn time elapsed: as it climbs
     the tone sweeps upward, the ring-mod gets faster and the hiss gets sharper,
     so holding the trigger sounds like the cannon charging to overload. */
  cannonBeamStart(x, y, z) {
    if (!this.ctx || this.muted || this._beamSnd) return;
    const sp = this._spatial(x, y, z, 3, 170);
    const t = this.ctx.currentTime;
    const out = this.ctx.createGain(); out.gain.value = 0.0001;
    const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    if (pan) { pan.pan.value = sp.pan; out.connect(pan); pan.connect(this.sfx); } else out.connect(this.sfx);
    // fade the whole bed in quickly so there is no click. The cannon is
    // deliberately quieter than a gunshot: it fires continuously, so a loud
    // sustained tone would be exhausting over a long burst.
    out.gain.linearRampToValueAtTime(Math.max(sp.gain, .3) * .5, t + .05);

    // --- main laser tone: НИЗКИЙ гул, слегка поднимается с нагревом ---
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(140, t);
    const olp = this.ctx.createBiquadFilter(); olp.type = 'lowpass'; olp.frequency.value = 900; olp.Q.value = 6;
    const og = this.ctx.createGain(); og.gain.value = .16;
    o.connect(olp); olp.connect(og); og.connect(out);
    o.start(t);

    // --- суб-бас: добавляет «мощь» и убирает писк ---
    const osub = this.ctx.createOscillator(); osub.type = 'sine';
    osub.frequency.setValueAtTime(70, t);
    const osg = this.ctx.createGain(); osg.gain.value = .12;
    osub.connect(osg); osg.connect(out);
    osub.start(t);

    // --- чуть выше, расстроенный, для «энергетического» шлейфа ---
    const o2 = this.ctx.createOscillator(); o2.type = 'square';
    o2.frequency.setValueAtTime(141.5, t);
    const o2g = this.ctx.createGain(); o2g.gain.value = .035;
    o2.connect(o2g); o2g.connect(out);
    o2.start(t);

    // --- ring modulation: низкий LFO даёт мягкий «рокот», а не писк ---
    const trem = this.ctx.createGain(); trem.gain.value = 0;
    const lfo = this.ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 14;
    const lfoGain = this.ctx.createGain(); lfoGain.gain.value = .05;
    lfo.connect(lfoGain); lfoGain.connect(trem.gain);
    // route the detuned tone through the tremolo gain
    o2.disconnect(); o2.connect(trem); trem.connect(out);
    lfo.start(t);

    // --- глухой низкий «воздух» вместо резкого шипения ---
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = 700; bp.Q.value = .8;
    const ng = this.ctx.createGain(); ng.gain.value = .05;
    src.connect(bp); bp.connect(ng); ng.connect(out);
    src.start(t);

    // --- ignition: глухой низкий «вумп» вместо визга ---
    const zap = this.ctx.createOscillator(); zap.type = 'triangle';
    zap.frequency.setValueAtTime(320, t);
    zap.frequency.exponentialRampToValueAtTime(90, t + .18);
    const zg = this.ctx.createGain();
    zg.gain.setValueAtTime(.16, t);
    zg.gain.exponentialRampToValueAtTime(.001, t + .2);
    zap.connect(zg); zg.connect(out);
    zap.start(t); zap.stop(t + .22);

    this._beamSnd = { o, osub, osg, o2, o2g, src, out, olp, bp, ng, lfo, lfoGain, trem, pan, heat: 0 };
  },
  /* Update the rising character of the beam. `heat` is 0..1. */
  cannonBeamHeat(heat) {
    const s = this._beamSnd;
    if (!s || !this.ctx) return;
    heat = U.clamp(heat, 0, 1);
    if (heat < s.heat - .05) { /* restarted */ }
    s.heat = heat;
    const t = this.ctx.currentTime, now = .08;
    // base гудит 140 → ~320 Hz с нагревом (остаётся басовым)
    const base = 140 + heat * 180;
    s.o.frequency.setTargetAtTime(base, t, now);
    if (s.osub) s.osub.frequency.setTargetAtTime(70 + heat * 60, t, now);
    s.o2.frequency.setTargetAtTime(base * 1.004, t, now);
    // фильтр приоткрывается, но остаётся глухим
    s.olp.frequency.setTargetAtTime(900 + heat * 1100, t, now);
    // мягкий рокот
    s.lfo.frequency.setTargetAtTime(14 + heat * 30, t, now);
    s.lfoGain.gain.setTargetAtTime(.05 + heat * .07, t, now);
    // «воздух» чуть поднимается, но не пищит
    s.bp.frequency.setTargetAtTime(700 + heat * 600, t, now);
    s.ng.gain.setTargetAtTime(.05 + heat * .05, t, now);
  },
  cannonBeamStop() {
    if (!this._beamSnd) return;
    const s = this._beamSnd; this._beamSnd = null;
    try {
      const t = this.ctx.currentTime;
      s.out.gain.cancelScheduledValues(t);
      s.out.gain.setValueAtTime(s.out.gain.value, t);
      s.out.gain.linearRampToValueAtTime(.0001, t + .08);
    } catch (e) { }
    const stop = (n) => { try { n.stop(); } catch (e) { } };
    const off = (n) => { try { n.disconnect(); } catch (e) { } };
    stop(s.o); if (s.osub) stop(s.osub); stop(s.o2); stop(s.lfo); stop(s.src);
    setTimeout(() => { off(s.out); off(s.o); if (s.osub) off(s.osub); if (s.osg) off(s.osg); off(s.o2); off(s.lfo); off(s.lfoGain); off(s.trem); off(s.src); off(s.olp); off(s.bp); off(s.ng); }, 160);
  },

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.22, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .55);
    src.connect(bp); bp.connect(g); g.connect(this.sfx);
    src.start(t); src.stop(t + .58);
  },

  },
  /* the drone is deliberately LOUD: a droning motor that carries a long way, so
     the opponent can hear it coming and hunt it down. Called repeatedly while
     the drone is airborne. */
  droneLoop(x, y, z) {
    if (!this.ctx || this.muted) return;
    const sp = this._spatial(x, y, z, 4, CFG.droneNoise);
    if (sp.gain <= .006) return;
    const t = this.ctx.currentTime;
    const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    const out = this.ctx.createGain(); out.gain.value = sp.gain * 1.15;
    if (pan) { pan.pan.value = sp.pan; out.connect(pan); pan.connect(this.sfx); } else out.connect(this.sfx);
    // two detuned saws → a rough propeller drone
    [86, 129].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      o.frequency.linearRampToValueAtTime(f * 1.06, t + .18);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(.001, t);
      g.gain.linearRampToValueAtTime(.10 / (i + 1), t + .03);
      g.gain.linearRampToValueAtTime(.001, t + .2);
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(t); o.stop(t + .22);
    });
    // a little airy noise on top
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.playbackRate.value = .9;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = .7;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(.001, t); ng.gain.linearRampToValueAtTime(.05, t + .04);
    ng.gain.linearRampToValueAtTime(.001, t + .2);
    src.connect(bp); bp.connect(ng); ng.connect(out);
    src.start(t); src.stop(t + .22);
  },
  growl(x, y, z, kind) {
    if (!this.ctx || this.muted) return;
    const sp = this._spatial(x, y, z, 4, 55);
    if (sp.gain <= .004) return;
    const t = this.ctx.currentTime;
    const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    const out = this.ctx.createGain(); out.gain.value = sp.gain * .8;
    if (pan) { pan.pan.value = sp.pan; out.connect(pan); pan.connect(this.sfx); } else out.connect(this.sfx);
    const base = kind === 'brute' ? 52 : kind === 'runner' ? 170 : kind === 'tank' ? 44
      : kind === 'flying' ? 240 : kind === 'robot' ? 66 : kind === 'spitter' ? 130
      : kind === 'digger' ? 72 : kind === 'splitter' ? 150 : kind === 'healer' ? 300
      : kind === 'shielder' ? 60 : kind === 'summoner' ? 46
      : kind === 'stalker' ? 120 : kind === 'spider' ? 88 : kind === 'cryomancer' ? 210
      : kind === 'devourer' ? 38 : kind === 'titanMini' ? 34 : 96;
    const o = this.ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(base * (.85 + Math.random() * .4), t);
    o.frequency.linearRampToValueAtTime(base * (.6 + Math.random() * .3), t + .4);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 3;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.001, t);
    g.gain.linearRampToValueAtTime(.22, t + .06);
    g.gain.exponentialRampToValueAtTime(.001, t + .5);
    o.connect(lp); lp.connect(g); g.connect(out);
    o.start(t); o.stop(t + .55);
  },
  /* ЗВУКИ ЗОМБИ: рычание, стон, визг — короткие узнаваемые реплики, чтобы
     орда «звучала» и по звуку было понятно, кто подходит. */
  zombieVoice(x, y, z, kind) {
    if (!this.ctx || this.muted) return;
    const sp = this._spatial(x, y, z, 3, 42);
    if (sp.gain <= .004) return;
    const t = this.ctx.currentTime;
    // визгливый / низкий тембр в зависимости от типа и случайности
    const deep = kind === 'brute' || kind === 'tank' || kind === 'devourer' || kind === 'titanMini' || kind === 'bossBrute' || kind === 'bossTitan' || kind === 'bossFinal';
    const high = kind === 'runner' || kind === 'crawler' || kind === 'healer' || kind === 'spitter';
    const rnd = Math.random();
    const f0 = deep ? U.rand(50, 78) : high ? U.rand(180, 300) : U.rand(95, 150);
    const o = this.ctx.createOscillator();
    o.type = rnd < .5 ? 'sawtooth' : 'square';
    o.frequency.setValueAtTime(f0, t);
    // «ныряющее» рычание с дрожью
    o.frequency.linearRampToValueAtTime(f0 * U.rand(.5, .75), t + .5);
    const lfo = this.ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = U.rand(9, 20);
    const lfoG = this.ctx.createGain(); lfoG.gain.value = f0 * .12;
    lfo.connect(lfoG); lfoG.connect(o.frequency);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = deep ? 620 : 1300; lp.Q.value = 4;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(sp.gain * (deep ? .30 : .20), t + .05);
    g.gain.exponentialRampToValueAtTime(.001, t + .55);
    const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    if (pan) { pan.pan.value = sp.pan; g.connect(pan); pan.connect(this.sfx); } else g.connect(this.sfx);
    o.connect(lp); lp.connect(g);
    o.start(t); o.stop(t + .6); lfo.start(t); lfo.stop(t + .6);
  },
  step(x, y, z) {
    if (!this.ctx || this.muted) return;
    const sp = this._spatial(x, y, z, 2, 26);
    if (sp.gain <= .004) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = .55 + Math.random() * .3;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900 + Math.random() * 500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.11 * sp.gain, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .1);
    src.connect(lp); lp.connect(g); g.connect(this.sfx);
    src.start(t); src.stop(t + .12);
  },
  waveStart() { [0, 130, 260].forEach((d, i) => setTimeout(() => this.tone([440, 587, 880][i], .22, 'square', .13), d)); },
  roundEnd(win) {
    const notes = win ? [523, 659, 784, 1046] : [523, 440, 349, 262];
    notes.forEach((n, i) => setTimeout(() => this.tone(n, .3, 'triangle', .14), i * 150));
  },
  uiClick() { this.tone(1100, .025, 'square', .05); },

  /* ============================================================
     MUSIC — menu / in-game / boss themes
     Each theme is a chord progression the scheduler re-triggers (bass line +
     arpeggio + pad), so no audio files are needed. Tracks can loop and only
     one can play at a time. `musicOff` mutes everything (settings toggle).
     ============================================================ */
  musicOff: false,
  music: {
    menu:    { root: 98.0,  scale: [0, 4, 7, 11, 14], prog: [0, -3, 5, -5], bpm: 76,  wave: 'sawtooth', bright: 1100, loop: true,  gain: .34, pad: true, drums: false },
    game:    { root: 82.41, scale: [0, 3, 5, 7, 10],  prog: [0, -2, -4, -1], bpm: 112, wave: 'sawtooth', bright: 1400, loop: true,  gain: .40, pad: true, drums: true },
    boss:    { root: 73.42, scale: [0, 2, 3, 6, 10],  prog: [0, -1, -5, -3], bpm: 138, wave: 'square',   bright: 1600, loop: true,  gain: .5,  pad: false, drums: true, snare: true, metal: true, riff: [0, 0, 3, 0, 5, 3, 0, -1] },
    /* ---- БОССЫ: у каждого своя тема в духе DOOM / Undertale / Deltarune ---- */
    /* СТРАЖ — торжественный марш (дух «Spear of Justice» / Undertale) */
    bossWarden: { root: 110.0, scale: [0, 3, 5, 7, 10], prog: [0, -2, -4, -5], bpm: 96,  wave: 'sawtooth', bright: 1200, loop: true, gain: .5, pad: true, drums: true, snare: true,
                  riff: [0, -1, 0, -1, 3, -1, 5, -1], melody: [0, 3, 5, 7, 5, 3, 0, -2] },
    /* ЖНЕЦ — мрачный вальс-жнец (дух Deltarune) */
    bossBrute:  { root: 87.31, scale: [0, 2, 3, 7, 8],  prog: [0, -3, -1, -5], bpm: 132, wave: 'square',   bright: 1500, loop: true, gain: .5, pad: false, drums: true, snare: true, metal: true,
                  riff: [0, 0, 8, 7, 5, 3, 0, -1], melody: [12, 10, 8, 7, 5, 3, 2, 0] },
    /* ТИТАН — тяжёлый DOOM-рифф */
    bossTitan:  { root: 65.41, scale: [0, 2, 5, 7, 10], prog: [0, -5, -3, -7], bpm: 92,  wave: 'sawtooth', bright: 900,  loop: true, gain: .5, pad: true, drums: true, snare: true, metal: true,
                  riff: [0, 0, 0, 0, 3, 3, 5, 3], melody: [0, 0, 5, 3, 7, 5, 10, 8] },
    /* ПОЖИРАТЕЛЬ — тёмный орган-финал (дух «Asgore» / DOOM) */
    bossFinal:  { root: 55.0,   scale: [0, 1, 5, 6, 10], prog: [0, -1, -6, -4], bpm: 150, wave: 'square',   bright: 1800, loop: true, gain: .55, pad: true, drums: true, snare: true, metal: true,
                  riff: [0, 0, 1, 0, -1, 6, 5, -1], melody: [0, 1, 5, 6, 5, 1, 0, -1] },
    /* ФИНАЛЬНЫЙ БОСС «МОЗГ»: бешеная метал-тема с хором (дух DOOM Eternal) */
    brainBoss:  { root: 61.74,  scale: [0, 1, 3, 6, 8],  prog: [0, -2, -5, -1], bpm: 158, wave: 'sawtooth', bright: 1300, loop: true, gain: .55, pad: true, drums: true, snare: true, metal: true,
                  riff: [0, 0, 0, 6, 5, 5, 3, 1], melody: [0, 3, 6, 8, 6, 3, 1, 0] }
  },
  /* play a track by name (idempotent); no-op if music is disabled */
  musicStart(name) {
    if (!this.ctx || this.muted || this.musicOff) return;
    if (this._music && this._music.name === name) return;
    const th = this.music[name];
    if (!th) return;
    this.musicStop();
    const out = this.ctx.createGain(); out.gain.value = .0001;
    out.connect(this.musicBus);
    const t0 = this.ctx.currentTime;
    out.gain.linearRampToValueAtTime(th.gain || .45, t0 + (name === 'menu' ? 1.6 : .8));
    this._music = { name, out, th, step: 0, timer: null, next: t0 + .1 };
    const beat = 60 / th.bpm;
    const schedule = () => {
      if (!this._music || !this.ctx) return;
      const m = this._music;
      const now = this.ctx.currentTime;
      while (m.next < now + .4) { this._musicStep(m, m.next, beat); m.next += beat * .5; }
      m.timer = setTimeout(schedule, 120);
    };
    schedule();
  },
  musicStop() {
    if (!this._music) return;
    const m = this._music; this._music = null;
    if (m.timer) clearTimeout(m.timer);
    try {
      const t = this.ctx.currentTime;
      m.out.gain.cancelScheduledValues(t);
      m.out.gain.setValueAtTime(m.out.gain.value, t);
      m.out.gain.linearRampToValueAtTime(.0001, t + .5);
      setTimeout(() => { try { m.out.disconnect(); } catch (e) { } }, 700);
    } catch (e) { }
  },
  /* settings toggle: remembers the choice and picks the right track back up */
  setMusicEnabled(on) {
    this.musicOff = !on;
    if (!on) this.musicStop();
    else if (typeof Game !== 'undefined') Game.refreshMusic();
  },
  /* backwards-compatible alias used when a boss appears */
  bossMusicStart(type) { this._bossTheme = type; this.musicStart(type); },
  bossMusicStop() { this._bossTheme = null; if (typeof Game !== 'undefined') Game.refreshMusic(); else this.musicStop(); },
  _musicStep(m, t, beat) {
    const th = m.th, i = m.step++;
    const chord = th.prog[Math.floor(i / 8) % th.prog.length];
    const semi = (n) => th.root * Math.pow(2, n / 12);
    // bass on every beat.
    // NOTE: the bass used to run through `th.wave`, i.e. a sawtooth/square on
    // most tracks, which buzzed harshly in the ears. The timbre is now a warm
    // triangle; the note itself (the melody) is untouched.
    if (i % 2 === 0) {
      const o = this.ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(semi(chord), t);
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = .7;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(.20, t);
      g.gain.exponentialRampToValueAtTime(.001, t + beat * .9);
      o.connect(lp); lp.connect(g); g.connect(m.out);
      o.start(t); o.stop(t + beat);
    }
    /* ---- МЕТАЛ-РИФФ (дух DOOM): рычащий дисторшн-гитар на каждой доле ---- */
    if (th.riff) {
      const rn = th.riff[i % th.riff.length];
      const rg = this.ctx.createGain();
      rg.gain.setValueAtTime(.001, t);
      rg.gain.linearRampToValueAtTime(.16, t + .012);
      rg.gain.exponentialRampToValueAtTime(.001, t + beat * .48);
      /* дисторшн через WaveShaper */
      const ws = this.ctx.createWaveShaper();
      if (!this._distCurve) {
        const c = new Float32Array(256);
        for (let k = 0; k < 256; k++) { const x = k / 128 - 1; c[k] = Math.tanh(x * 4.5); }
        this._distCurve = c;
      }
      ws.curve = this._distCurve; ws.oversample = '2x';
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 1.1;
      const o1 = this.ctx.createOscillator(); o1.type = 'sawtooth';
      o1.frequency.setValueAtTime(semi(chord + rn), t);
      const o2 = this.ctx.createOscillator(); o2.type = 'sawtooth';
      o2.frequency.setValueAtTime(semi(chord + rn + .12), t);       // лёгкий расстрой
      o1.connect(ws); o2.connect(ws); ws.connect(lp); lp.connect(rg); rg.connect(m.out);
      o1.start(t); o1.stop(t + beat * .5); o2.start(t); o2.stop(t + beat * .5);
    }
    // a soft kick + hat for the driving tracks
    if (th.drums) {
      if (i % 2 === 0) {
        const k = this.ctx.createOscillator(); k.type = 'sine';
        k.frequency.setValueAtTime(120, t); k.frequency.exponentialRampToValueAtTime(45, t + .12);
        const kg = this.ctx.createGain();
        kg.gain.setValueAtTime(.22, t); kg.gain.exponentialRampToValueAtTime(.001, t + .16);
        k.connect(kg); kg.connect(m.out); k.start(t); k.stop(t + .18);
      }
      if (i % 2 === 1) {
        const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
        const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
        const hg = this.ctx.createGain();
        hg.gain.setValueAtTime(.05 * (th.metal ? 1.6 : 1), t); hg.gain.exponentialRampToValueAtTime(.001, t + (th.metal ? .1 : .06));
        src.connect(hp); hp.connect(hg); hg.connect(m.out); src.start(t); src.stop(t + .12);
      }
      /* ---- SNARE (для боссовых тем): на 2 и 4 ---- */
      if (th.snare && i % 4 === 2) {
        const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
        const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = .8;
        const sg = this.ctx.createGain();
        sg.gain.setValueAtTime(.14, t); sg.gain.exponentialRampToValueAtTime(.001, t + .18);
        s.connect(bp); bp.connect(sg); sg.connect(m.out); s.start(t); s.stop(t + .2);
      }
    }
    // arpeggio note (higher)
    const deg = th.scale[(i * 3) % th.scale.length];
    const a = this.ctx.createOscillator(); a.type = 'triangle';
    a.frequency.setValueAtTime(semi(chord + deg + 24), t);
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = th.bright; bp.Q.value = 1.2;
    const ag = this.ctx.createGain();
    ag.gain.setValueAtTime(.10, t);
    ag.gain.exponentialRampToValueAtTime(.001, t + beat * .45);
    a.connect(bp); bp.connect(ag); ag.connect(m.out);
    a.start(t); a.stop(t + beat * .5);
    /* ---- МЕЛОДИЯ: ведущая линия поверх риффа (у боссов) ---- */
    if (th.melody) {
      const mn = th.melody[i % th.melody.length];
      const mo = this.ctx.createOscillator(); mo.type = 'square';
      mo.frequency.setValueAtTime(semi(chord + mn + 12), t);
      const mg = this.ctx.createGain();
      mg.gain.setValueAtTime(.001, t); mg.gain.linearRampToValueAtTime(.075, t + .01);
      mg.gain.exponentialRampToValueAtTime(.001, t + beat * .46);
      mo.connect(mg); mg.connect(m.out); mo.start(t); mo.stop(t + beat * .5);
    }
    // a sustained pad at the top of each bar (warm triangle — same notes)
    if (i % 8 === 0) {
      const p = this.ctx.createOscillator(); p.type = 'triangle';
      p.frequency.setValueAtTime(semi(chord + 12), t);
      p.frequency.linearRampToValueAtTime(semi(chord + 12 + th.scale[2]), t + beat * 3);
      const pg = this.ctx.createGain();
      pg.gain.setValueAtTime(.001, t);
      pg.gain.linearRampToValueAtTime(.05, t + beat);
      pg.gain.exponentialRampToValueAtTime(.001, t + beat * 3.6);
      // a gentle low-pass keeps the sustained pad round instead of buzzy
      const plp = this.ctx.createBiquadFilter(); plp.type = 'lowpass'; plp.frequency.value = 900; plp.Q.value = .6;
      p.connect(plp); plp.connect(pg); pg.connect(m.out);
      p.start(t); p.stop(t + beat * 4);
    }
  },

  ambientStart() {
    if (!this.ctx || this.amb) return;
    // low wind bed
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = .7;
    const g = this.ctx.createGain(); g.gain.value = .045;
    src.connect(lp); lp.connect(g); g.connect(this.sfx);
    src.start();
    this.amb = { src, g };
  },
  ambientStop() { if (this.amb) { try { this.amb.src.stop(); } catch (e) { } this.amb = null; } }
};

</script>
<script>
/* ===== 03b-destruct.js ===== */
/* ============================================================
   03b — РАЗРУШАЕМЫЙ МИР (как в Pixelwreck)
   Уровень растеризуется в сетку клеток 8x8. Любую клетку можно выбить
   выстрелом или взрывом; сыпучие материалы (земля, песок, дерево, ящики)
   теряют опору и осыпаются с физикой. Твёрдые (камень, металл, бетон)
   пробиваются, но не осыпаются — иначе здания рушились бы сами.
   Рендер — в offscreen-текстуру карты, перерисовываются только изменённые клетки.
   ============================================================ */

/* материалы: col — основной цвет, top — верхняя кромка, fall — осыпается,
   slide — скользит по диагонали, hard — не разрушается ничем */
const MAT2 = [
  null,
  { id: 'dirt',     col: 0x6b5238, top: 0x7ba04e, fall: true },
  { id: 'sand',     col: 0xc9ac6c, top: 0xe6cf8c, fall: true, slide: true },
  { id: 'rock',     col: 0x787265, top: 0x9a9484 },
  { id: 'brick',    col: 0x8f5650, top: 0xbe7268, fall: true },
  { id: 'concrete', col: 0x8b8b85, top: 0xb0b0aa, fall: true },
  { id: 'metal',    col: 0x7d8798, top: 0xacb6c6 },
  { id: 'glass',    col: 0x8fc9dd, top: 0xc6ecf7, glass: true, fall: true },
  { id: 'wood',     col: 0xa87a38, top: 0xd9a052, fall: true, crate: true },
  { id: 'barrel',   col: 0xa84031, top: 0xd85a46, fall: true, boom: true },
  { id: 'roof',     col: 0x5d5d66, top: 0x7f7f88, fall: true },
  { id: 'floor',    col: 0x566d78, top: 0x74929f, fall: true },
  { id: 'wall',     col: 0x4c515e, top: 0x666c7c },
  { id: 'door',     col: 0x52351c, top: 0x6f4a2c, fall: true },
  { id: 'plat',     col: 0x7d8798, top: 0xacb6c6, oneWay: true },
  { id: 'bedrock',  col: 0x2c3038, top: 0x3a3f4a, hard: true },
];
const M2 = {};
for (let i = 1; i < MAT2.length; i++) M2[MAT2[i].id] = i;

const KIND_MAT = {
  ground: M2.dirt, sand: M2.sand, rock: M2.rock, metal: M2.metal, brick: M2.brick,
  concrete: M2.concrete, glass: M2.glass, shelf: M2.wood, crate: M2.wood, barrel: M2.barrel,
  roof: M2.roof, floor: M2.floor, wall: M2.wall, door: M2.door, plat: M2.plat,
};

const DEST = {
  cw: 8, ch: 8, cols: 0, rows: 0, w: 0, h: 0,
  cells: null, nflag: null,
  alist: [], nlist: [],
  tex: null, tctx: null,
  dirty: true,
  moves: 0,
  carved: 0,

  build(L) {
    /* клетки считаем сразу для всех карт (это дёшево), а тяжёлую текстуру —
       только для активной: attach() */
    const r = this.rasterize(L);
    L.destCells = r.cells;
    L.destCols = r.cols;
    L.destRows = r.rows;
  },

  rasterize(L) {
    const cw = this.cw, ch = this.ch;
    const cols = Math.ceil(L.w / cw) + 1;
    const rows = Math.ceil(L.h / ch) + 1;
    const cells = new Uint8Array(cols * rows);
    for (const r of L.rects) {
      const m = KIND_MAT[r.kind] || M2.dirt;
      const x0 = Math.max(0, Math.floor(r.x / cw));
      const x1 = Math.min(cols - 1, Math.floor((r.x + r.w - 1) / cw));
      const y0 = Math.max(0, Math.floor(r.y / ch));
      const y1 = Math.min(rows - 1, Math.floor((r.y + r.h - 1) / ch));
      for (let cy = y0; cy <= y1; cy++) {
        const row = cy * cols;
        for (let cx = x0; cx <= x1; cx++) cells[row + cx] = m;
      }
    }
    for (let cx = 0; cx < cols; cx++) { cells[cx] = M2.bedrock; cells[(rows - 1) * cols + cx] = M2.bedrock; }
    for (let cy = 0; cy < rows; cy++) { cells[cy * cols] = M2.bedrock; cells[cy * cols + cols - 1] = M2.bedrock; }
    return { cells, cols, rows };
  },

  /** Подключить карту к симуляции (вызывается при старте забега). */
  attach(L) {
    this.w = L.w; this.h = L.h;
    this.cols = L.destCols; this.rows = L.destRows;
    const n = this.cols * this.rows;
    this.cells = new Uint8Array(n);
    this.cells.set(L.destCells);
    this.nflag = new Uint8Array(n);
    this.alist = []; this.nlist = [];
    this.moves = 0; this.carved = 0; this.sweepRow = 0;

    this.tex = document.createElement('canvas');
    this.tex.width = L.w; this.tex.height = L.h;
    this.tctx = this.tex.getContext('2d');
    this.tctx.clearRect(0, 0, L.w, L.h);
    for (let cy = 0; cy < this.rows; cy++) for (let cx = 0; cx < this.cols; cx++) {
      if (this.cells[cy * this.cols + cx]) this._paintCell(cx, cy);
    }
    this.dirty = true;
  },

  _paintCell(cx, cy) {
    const c = this.tctx, k = cy * this.cols + cx, m = this.cells[k];
    const x = cx * this.cw, y = cy * this.ch, W = this.cw, H = this.ch;
    c.clearRect(x, y, W, H);
    if (!m) return;
    const mat = MAT2[m];
    let s = (cx * 7919 + cy * 104729) & 0xffff;
    const sh = 0.86 + ((s >> 3) & 7) * 0.04;
    c.fillStyle = shadeRGB(mat.col, sh);
    c.fillRect(x, y, W, H);

    const up = cy > 0 ? this.cells[k - this.cols] : 1;
    const dn = cy < this.rows - 1 ? this.cells[k + this.cols] : 1;
    const lf = cx > 0 ? this.cells[k - 1] : 1;
    const rt = cx < this.cols - 1 ? this.cells[k + 1] : 1;

    /* верхняя кромка */
    if (!up) {
      c.fillStyle = shadeRGB(mat.top, sh);
      c.fillRect(x, y, W, 3);
      c.fillStyle = shadeRGB(mat.top, sh * 1.2);
      c.fillRect(x, y, W, 1);
    }

    /* фактура по материалу */
    switch (mat.id) {
      case 'brick':
        c.fillStyle = shadeRGB(mat.col, sh * 0.62);
        c.fillRect(x, y + 3, W, 1);
        c.fillRect(x + ((cy & 1) ? 0 : 4), y, 1, 3);
        c.fillRect(x + ((cy & 1) ? 4 : 0), y + 4, 1, 4);
        c.fillStyle = shadeRGB(mat.col, sh * 1.14);
        c.fillRect(x, y + 4, W, 1);
        break;
      case 'metal':
        c.fillStyle = shadeRGB(mat.col, sh * 1.35);
        c.fillRect(x + 1, y + 1, W - 2, 1);
        c.fillStyle = shadeRGB(mat.col, sh * 0.6);
        c.fillRect(x, y + H - 2, W, 1);
        if (((cx + cy) & 1) === 0) { c.fillStyle = shadeRGB(mat.col, sh * 0.7); c.fillRect(x + 1, y + 4, 2, 2); }
        break;
      case 'plat':
        c.fillStyle = shadeRGB(mat.top, sh * 1.1);
        c.fillRect(x, y, W, 2);
        c.fillStyle = shadeRGB(mat.col, sh * 0.6);
        c.fillRect(x, y + H - 3, W, 3);
        break;
      case 'wood':
        c.fillStyle = shadeRGB(mat.col, sh * 0.66);
        c.fillRect(x, y + 2, W, 1);
        c.fillRect(x, y + 6, W, 1);
        c.fillRect(x + ((s >> 5) & 3), y, 1, 2);
        if (mat.crate) {
          c.fillStyle = shadeRGB(mat.top, sh * 1.15);
          c.fillRect(x, y, W, 1);
        }
        break;
      case 'glass':
        c.fillStyle = 'rgba(255,255,255,.42)';
        c.fillRect(x + 1, y + 1, W - 3, 1);
        c.fillRect(x + 1, y + 2, 2, 1);
        c.fillStyle = 'rgba(190,235,255,.30)';
        c.fillRect(x + W - 3, y + 3, 1, H - 5);
        break;
      case 'rock':
        c.fillStyle = shadeRGB(mat.col, sh * 0.78);
        c.fillRect(x + 1, y + ((s >> 4) & 3) + 3, 4, 2);
        c.fillStyle = shadeRGB(mat.col, sh * 1.16);
        c.fillRect(x + 4, y + ((s >> 7) & 3) + 1, 3, 2);
        break;
      case 'concrete':
        c.fillStyle = shadeRGB(mat.col, sh * 0.8);
        c.fillRect(x + ((s >> 3) & 5), y + ((s >> 6) & 5), 2, 1);
        if ((s & 15) === 0) { c.fillRect(x, y + 4, W, 1); }
        c.fillStyle = shadeRGB(mat.col, sh * 1.1);
        c.fillRect(x + ((s >> 9) & 5), y + ((s >> 11) & 5), 1, 1);
        break;
      case 'sand':
        c.fillStyle = shadeRGB(mat.col, sh * 1.14);
        c.fillRect(x + ((s >> 3) & 5), y + ((s >> 6) & 5), 1, 1);
        c.fillStyle = shadeRGB(mat.col, sh * 0.86);
        c.fillRect(x + ((s >> 9) & 5), y + ((s >> 11) & 5), 1, 1);
        break;
      case 'dirt':
        c.fillStyle = shadeRGB(mat.col, sh * 0.78);
        c.fillRect(x + ((s >> 3) & 5), y + ((s >> 6) & 4), 2, 1);
        if ((s & 7) === 0) { c.fillStyle = shadeRGB(mat.col, sh * 1.2); c.fillRect(x + ((s >> 9) & 5), y + 4, 1, 2); }
        break;
      case 'barrel':
        c.fillStyle = '#e8c23a';
        c.fillRect(x, y + 3, W, 2);
        c.fillStyle = shadeRGB(mat.col, sh * 1.3);
        c.fillRect(x + 1, y + 1, W - 2, 1);
        break;
      case 'roof':
        c.fillStyle = shadeRGB(mat.col, sh * 0.74);
        c.fillRect(x, y + 2, 4, 1);
        c.fillRect(x + 4, y + 5, 4, 1);
        break;
      case 'floor':
        c.fillStyle = shadeRGB(mat.col, sh * 0.74);
        c.fillRect(x, y + 4, W, 1);
        c.fillRect(x + 4, y, 1, H);
        break;
      case 'wall':
        c.fillStyle = shadeRGB(mat.col, sh * 0.78);
        c.fillRect(x + 3, y, 1, H);
        break;
      case 'door':
        c.fillStyle = shadeRGB(mat.col, sh * 0.7);
        c.fillRect(x + 2, y, 1, H);
        c.fillRect(x + 5, y, 1, H);
        break;
      case 'bedrock':
        c.fillStyle = shadeRGB(mat.col, sh * 0.7);
        c.fillRect(x + ((s >> 4) & 5), y + ((s >> 7) & 5), 3, 3);
        break;
    }

    /* затенение открытых краёв — воронки выглядят объёмно */
    c.fillStyle = 'rgba(0,0,0,.34)';
    if (!lf) c.fillRect(x, y, 1, H);
    if (!rt) c.fillRect(x + W - 1, y, 1, H);
    if (!dn) c.fillRect(x, y + H - 1, W, 1);
    if (!up) c.fillStyle = 'rgba(255,255,255,.06)';
    if (!up) c.fillRect(x + 1, y + 3, W - 2, 1);
  },

  _repaintArea(cx0, cy0, cx1, cy1) {
    for (let cy = Math.max(0, cy0 - 1); cy <= Math.min(this.rows - 1, cy1 + 1); cy++)
      for (let cx = Math.max(0, cx0 - 1); cx <= Math.min(this.cols - 1, cx1 + 1); cx++)
        this._paintCell(cx, cy);
  },

  /* ---------------- доступ ---------------- */
  mat(cx, cy) {
    if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return M2.bedrock;
    return this.cells[cy * this.cols + cx];
  },
  solid(cx, cy) {
    const m = this.mat(cx, cy);
    return m !== 0 && !MAT2[m].oneWay;
  },
  solidAny(cx, cy) { return this.mat(cx, cy) !== 0; },
  solidPx(x, y) {
    return this.solid(Math.floor(x / this.cw), Math.floor(y / this.ch));
  },

  /** Есть ли твёрдые клетки в прямоугольнике. */
  hitBox(x, y, w, h) {
    const cx0 = Math.floor(x / this.cw), cx1 = Math.floor((x + w - 0.001) / this.cw);
    const cy0 = Math.floor(y / this.ch), cy1 = Math.floor((y + h - 0.001) / this.ch);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      if (this.solid(cx, cy)) return true;
    }
    return false;
  },

  /* ---------------- активация ---------------- */
  wake(cx, cy) {
    if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return;
    const k = cy * this.cols + cx;
    if (this.nflag[k]) return;
    this.nflag[k] = 1;
    this.nlist.push(k);
    /* соседи тоже должны пересчитаться */
    this._wakeRaw(cx - 1, cy); this._wakeRaw(cx + 1, cy);
    this._wakeRaw(cx, cy - 1); this._wakeRaw(cx, cy + 1);
  },
  _wakeRaw(cx, cy) {
    if (cx < 0 || cy < 0 || cx >= this.cols || cy >= this.rows) return;
    const k = cy * this.cols + cx;
    if (this.nflag[k]) return;
    this.nflag[k] = 1;
    this.nlist.push(k);
  },

  /* ---------------- разрушение ---------------- */
  /** Выбить круг радиусом r (в пикселях). Возвращает число уничтоженных клеток. */
  carve(x, y, r, power) {
    const cw = this.cw, ch = this.ch;
    const cx0 = Math.max(1, Math.floor((x - r) / cw)), cx1 = Math.min(this.cols - 2, Math.ceil((x + r) / cw));
    const cy0 = Math.max(1, Math.floor((y - r) / ch)), cy1 = Math.min(this.rows - 2, Math.ceil((y + r) / ch));
    const r2 = r * r;
    let n = 0;
    for (let cy = cy0; cy <= cy1; cy++) {
      const dy = cy * ch + ch / 2 - y;
      const row = cy * this.cols;
      for (let cx = cx0; cx <= cx1; cx++) {
        const dx = cx * cw + cw / 2 - x;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const m = this.cells[row + cx];
        if (!m || MAT2[m].hard) continue;
        const f = 1 - Math.sqrt(d2) / r;
        if (power !== undefined && power < 1 && Math.random() > f * power) continue;
        this.cells[row + cx] = 0;
        n++;
        this.wake(cx, cy);
      }
    }
    if (n) {
      this._repaintArea(cx0, cy0, cx1, cy1);
      this.carved += n;
      /* разбудить широкую область: без этого острова остаются висеть в воздухе */
      this._wakeRect(cx0 - 3, cy0 - 3, cx1 + 3, cy1 + 3);
    }
    return n;
  },

  _wakeRect(x0, y0, x1, y1) {
    for (let cy = Math.max(0, y0); cy <= Math.min(this.rows - 1, y1); cy++)
      for (let cx = Math.max(0, x0); cx <= Math.min(this.cols - 1, x1); cx++)
        this._wakeRaw(cx, cy);
  },

  /** Пробить маленькую дырку от пули. */
  carveBullet(x, y, r) {
    return this.carve(x, y, r === undefined ? 4 : r, 1);
  },

  /* ---------------- падение сыпучих ---------------- */
  /** Постепенный обход карты: любая клетка без опоры гарантированно проснётся. */
  sweep() {
    const per = Math.max(1, Math.ceil(this.rows / 40));
    for (let r = 0; r < per; r++) {
      const cy = this.sweepRow;
      this.sweepRow = (this.sweepRow + 1) % this.rows;
      if (cy + 1 >= this.rows) continue;
      const row = cy * this.cols;
      const below = row + this.cols;
      for (let cx = 1; cx < this.cols - 1; cx++) {
        const m = this.cells[row + cx];
        if (!m || !MAT2[m].fall) continue;
        if (this.cells[below + cx] === 0) this._wakeRaw(cx, cy);
      }
    }
  },

  step() {
    this.sweep();
    const cur = this.alist;
    this.alist = this.nlist; this.nlist = cur;
    this.nlist.length = 0;
    this.nflag.fill(0);
    this.moves = 0;

    const cols = this.cols, cells = this.cells;
    let tx0 = 1e9, ty0 = 1e9, tx1 = -1, ty1 = -1;
    const LIMIT = 20000;
    let i = 0;
    const n = this.alist.length;

    for (; i < n; i++) {
      if (this.moves > LIMIT) break;
      const k = this.alist[i];
      const m = cells[k];
      if (!m) continue;
      const mat = MAT2[m];
      if (!mat.fall) continue;
      const cy = (k / cols) | 0, cx = k - cy * cols;
      if (cy + 1 >= this.rows) continue;
      const below = k + cols;

      let did = false;
      if (cells[below] === 0) { this._swap(k, below, cx, cy); did = true; }
      else if (mat.slide) {
        const d = Math.random() < 0.5 ? -1 : 1;
        did = this._trySlide(k, cx, cy, d) || this._trySlide(k, cx, cy, -d);
      }
      if (did) {
        this.moves++;
        if (cx - 2 < tx0) tx0 = cx - 2;
        if (cx + 2 > tx1) tx1 = cx + 2;
        if (cy - 2 < ty0) ty0 = cy - 2;
        if (cy + 2 > ty1) ty1 = cy + 2;
      }
    }
    /* если не успели всё за кадр — остаток обрабатываем в следующем */
    if (i < n) {
      for (let j = i; j < n; j++) {
        const k2 = this.alist[j];
        if (this.nflag[k2]) continue;
        this.nflag[k2] = 1;
        this.nlist.push(k2);
      }
    }
    if (tx1 >= 0) this._repaintArea(tx0, ty0, tx1, ty1);
  },

  _trySlide(k, cx, cy, d) {
    const nx = cx + d;
    if (nx < 1 || nx >= this.cols - 1) return false;
    const j = k + d;
    const jb = j + this.cols;
    if (this.cells[jb] !== 0 || this.cells[j] !== 0) return false;
    this._swap(k, jb, cx, cy);
    return true;
  },

  _swap(a, b, cx, cy) {
    const m = this.cells[a];
    const m2 = this.cells[b];
    this.cells[b] = m;
    this.cells[a] = m2;
    const by = (b / this.cols) | 0, bx = b - by * this.cols;
    this._wakeRaw(bx - 1, by); this._wakeRaw(bx + 1, by);
    this._wakeRaw(bx, by - 1); this._wakeRaw(bx, by + 1);
    this._wakeRaw(bx, by);
    this.wake(cx, cy);
  },

  /* ---------------- луч по клеткам ---------------- */
  ray(x0, y0, x1, y1) {
    const steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4));
    const dx = (x1 - x0) / steps, dy = (y1 - y0) / steps;
    let px = x0, py = y0;
    for (let s = 1; s <= steps; s++) {
      px += dx; py += dy;
      const cx = Math.floor(px / this.cw), cy = Math.floor(py / this.ch);
      const m = this.mat(cx, cy);
      if (m !== 0 && !MAT2[m].oneWay) return { x: px, y: py, cx, cy, m };
    }
    return null;
  },

  /* ---------------- отрисовка ---------------- */
  draw(ctx, camL, camT, camW, camH) {
    const sx = Math.max(0, Math.floor(camL)), sy = Math.max(0, Math.floor(camT));
    const ex = Math.min(this.w, Math.ceil(camL + camW)), ey = Math.min(this.h, Math.ceil(camT + camH));
    if (ex <= sx || ey <= sy) return;
    ctx.drawImage(this.tex, sx, sy, ex - sx, ey - sy, sx, sy, ex - sx, ey - sy);
  },
};


/* ===== 03-core.js ===== */
/* ============================================================
   03 — CORE: пиксельный канвас, битмап-шрифт, ввод (клавиатура / мышь / тач)
   Вся игра рисуется в offscreen-буфер ЛОГИЧЕСКОГО разрешения (по умолчанию
   640x360) и выводится на экран nearest-neighbor'ом — поэтому картинка
   гарантированно пиксельная, а не мыльная.
   ============================================================ */

const CFG2 = {
  VH: 360,              // логическая высота кадра
  VW_MIN: 400, VW_MAX: 1100,
  PPM: 14,              // пикселей в одном "метре"
  GRAV: 1500,
  TILE: 16,
  PLAYER_H: 36,
  PLAYER_W: 15,
  WALK: 105,
  RUN: 172,
  CROUCH_MUL: 0.45,
  JUMP_V: 520,
  MAX_FALL: 900,
  MAGNET: 46,
};

const G2 = window.G2 = {
  cv: null, dctx: null,      // экран
  oc: null, ctx: null,       // логический буфер
  vw: 640, vh: 360,          // логический размер
  px: 2, offX: 0, offY: 0,   // масштаб и смещение буфера на экране (device px)
  cssPx: 2, cssOffX: 0, cssOffY: 0,
  dpr: 1,
  time: 0, dt: 0, frames: 0, fps: 60, _fpsAcc: 0, _fpsN: 0,
  isMobile: false,
  mouse: { x: 320, y: 180, down: false, rdown: false, moved: false },
  keys: Object.create(null),
  pointers: new Map(),
  sticks: { move: null, aim: null },
  btn: Object.create(null),
  btnHeld: Object.create(null),
  autoAim: true,
  paused: false,
};

/* ---------------------------------------------------------------- утилиты */

window.__errs = [];
function __logErr(s) {
  window.__errs.push(s);
  document.title = 'ERR ' + window.__errs.length;
  try {
    let d = document.getElementById('__errbox');
    if (!d) { d = document.createElement('pre'); d.id = '__errbox'; document.body.appendChild(d); }
    d.textContent += s + '\n';
  } catch (e) { }
}
window.addEventListener('error', e => {
  __logErr(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
});
window.addEventListener('unhandledrejection', e => __logErr('promise: ' + String(e.reason)));

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function approach(cur, target, delta) {
  return cur < target ? Math.min(cur + delta, target) : Math.max(cur - delta, target);
}
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function aabbHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function pointIn(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function hexRGB(n) { return 'rgb(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ')'; }
function shadeRGB(n, f) {
  return 'rgb(' + (clamp(((n >> 16) & 255) * f, 0, 255) | 0) + ',' +
    (clamp(((n >> 8) & 255) * f, 0, 255) | 0) + ',' + (clamp((n & 255) * f, 0, 255) | 0) + ')';
}

/* хранение прогресса */
const Store2 = {
  key: 'banana2d_v1',
  data: null,
  _safeGet() {
    try { return localStorage.getItem(this.key); } catch (e) { return null; }
  },
  _safeSet(v) {
    try { localStorage.setItem(this.key, v); return true; } catch (e) { return false; }
  },
  load() {
    if (this.data) return this.data;
    let d = null;
    try { d = JSON.parse(this._safeGet() || 'null'); } catch (e) { d = null; }
    if (!d || typeof d !== 'object') d = {};
    const def = {
      bestWave: 0, bestScore: 0, kills: 0, money: 0, shots: 0, hits: 0, heads: 0,
      deaths: 0, playtime: 0, runs: 0, bananas: 0, bought: {}, achievements: {},
      settings: { autoAim: true, sfx: 0.6, music: 0.5, gore: true, screenShake: true },
    };
    for (const k in def) if (!(k in d)) d[k] = def[k];
    this.data = d;
    return d;
  },
  save() { this._safeSet(JSON.stringify(this.data)); },
};

/* ---------------------------------------------------------------- канвас */

function coreInit() {
  G2.cv = document.getElementById('cv');
  G2.dctx = G2.cv.getContext('2d', { alpha: false });
  G2.oc = document.createElement('canvas');
  G2.ctx = G2.oc.getContext('2d', { alpha: false });
  G2.isMobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  window.addEventListener('resize', coreResize);
  window.addEventListener('orientationchange', () => setTimeout(coreResize, 120));
  coreResize();
  inputInit();
}

function coreResize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  G2.dpr = dpr;
  G2.cv.width = Math.max(2, Math.round(cw * dpr));
  G2.cv.height = Math.max(2, Math.round(ch * dpr));
  G2.cv.style.width = cw + 'px';
  G2.cv.style.height = ch + 'px';
  G2.vh = CFG2.VH;
  G2.vw = clamp(Math.round(CFG2.VH * (cw / ch)), CFG2.VW_MIN, CFG2.VW_MAX);
  G2.oc.width = G2.vw;
  G2.oc.height = G2.vh;
  G2.px = Math.min(G2.cv.width / G2.vw, G2.cv.height / G2.vh);
  G2.offX = Math.floor((G2.cv.width - G2.vw * G2.px) / 2);
  G2.offY = Math.floor((G2.cv.height - G2.vh * G2.px) / 2);
  G2.cssPx = G2.px / dpr;
  G2.cssOffX = G2.offX / dpr;
  G2.cssOffY = G2.offY / dpr;
  G2.ctx.imageSmoothingEnabled = false;
  G2.dctx.imageSmoothingEnabled = false;
}

/** Вывести логический буфер на экран (nearest-neighbor, с чёрными полями). */
function corePresent() {
  const d = G2.dctx;
  d.imageSmoothingEnabled = false;
  d.fillStyle = '#05060a';
  d.fillRect(0, 0, G2.cv.width, G2.cv.height);
  d.drawImage(G2.oc, 0, 0, G2.vw, G2.vh,
    G2.offX, G2.offY, Math.round(G2.vw * G2.px), Math.round(G2.vh * G2.px));
}

/* ---------------------------------------------------------------- битмап-шрифт */

const PFONT = {
  _measure: null,
  _glyph: Object.create(null),
  _tint: Object.create(null),
  _n: 0,

  _mctx() {
    if (!this._measure) {
      const c = document.createElement('canvas'); c.width = 8; c.height = 8;
      this._measure = c.getContext('2d');
    }
    return this._measure;
  },

  glyph(ch, size, bold) {
    const key = ch + '\u0001' + size + '\u0001' + (bold ? 1 : 0);
    let g = this._glyph[key];
    if (g) return g;
    const mc = this._mctx();
    mc.font = (bold ? '700 ' : '') + size + 'px "Segoe UI", Tahoma, Verdana, Arial, sans-serif';
    const adv = Math.max(1, Math.round(mc.measureText(ch).width));
    const W = adv + 2, H = size + 6;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.font = (bold ? '700 ' : '') + size + 'px "Segoe UI", Tahoma, Verdana, Arial, sans-serif';
    c.textBaseline = 'top';
    c.fillStyle = '#fff';
    c.fillText(ch, 1, 1);
    const im = c.getImageData(0, 0, W, H), d = im.data;
    for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 118 ? 255 : 0;
    c.putImageData(im, 0, 0);
    g = { cv, W, H, adv, id: 'g' + (this._n++) };
    this._glyph[key] = g;
    return g;
  },

  tinted(g, color) {
    const key = g.id + '\u0001' + color;
    let t = this._tint[key];
    if (t) return t;
    const cv = document.createElement('canvas'); cv.width = g.W; cv.height = g.H;
    const c = cv.getContext('2d');
    c.drawImage(g.cv, 0, 0);
    c.globalCompositeOperation = 'source-in';
    c.fillStyle = color;
    c.fillRect(0, 0, g.W, g.H);
    this._tint[key] = cv;
    return cv;
  },

  width(str, size, bold) {
    let w = 0;
    for (let i = 0; i < str.length; i++) w += this.glyph(str[i], size, bold).adv;
    return w;
  },

  draw(ctx, str, x, y, size, color, align, bold, noShadow) {
    str = String(str);
    let w = 0;
    for (let i = 0; i < str.length; i++) w += this.glyph(str[i], size, bold).adv;
    let xi = Math.round(x);
    if (align === 'center') xi = Math.round(x - w / 2);
    else if (align === 'right') xi = Math.round(x - w);
    const yi = Math.round(y) - Math.round(size * 0.78);
    const SH = '#05070b';
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = this.glyph(ch, size, bold);
      if (ch !== ' ') {
        if (!noShadow) {
          const sh = this.tinted(g, SH);
          ctx.drawImage(sh, xi - 1, yi);
          ctx.drawImage(sh, xi + 1, yi);
          ctx.drawImage(sh, xi, yi - 1);
          ctx.drawImage(sh, xi, yi + 1);
        }
        ctx.drawImage(this.tinted(g, color), xi, yi);
      }
      xi += g.adv;
    }
    return w;
  },
};

function inputInit() {
  const cv = G2.cv;

  window.addEventListener('keydown', e => {
    if (e.repeat) { e.preventDefault(); return; }
    G2.keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0) e.preventDefault();
    if (typeof onGameKey === 'function') onGameKey(e.code);
  });
  window.addEventListener('keyup', e => { G2.keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in G2.keys) G2.keys[k] = false; });

  window.addEventListener('mousemove', e => {
    const p = toLogical(e.clientX, e.clientY);
    G2.mouse.x = p.x; G2.mouse.y = p.y; G2.mouse.moved = true;
  });
  cv.addEventListener('mousedown', e => {
    if (e.button === 0) { G2.mouse.down = true; G2.click = toLogical(e.clientX, e.clientY); }
    if (e.button === 2) G2.mouse.rdown = true;
    e.preventDefault();
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 0) G2.mouse.down = false;
    if (e.button === 2) G2.mouse.rdown = false;
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    const uiMode = G2.uiMode;
    for (const t of e.changedTouches) {
      const p = toLogical(t.clientX, t.clientY);
      if (uiMode) { G2.click = p; continue; }
      const b = hitButton(p.x, p.y);
      if (b) { G2.btn[b] = true; G2.pointers.set(t.identifier, { kind: 'btn', id: b }); }
      else if (p.x < G2.vw * 0.45 && !G2.sticks.move) {
        G2.sticks.move = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, dx: 0, dy: 0 };
        G2.pointers.set(t.identifier, { kind: 'move' });
      } else if (!G2.sticks.aim) {
        G2.sticks.aim = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, dx: 0, dy: 0 };
        G2.pointers.set(t.identifier, { kind: 'aim' });
      }
    }
  }, { passive: false });

  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = toLogical(t.clientX, t.clientY);
      const rec = G2.pointers.get(t.identifier);
      if (!rec) continue;
      if (rec.kind === 'move' && G2.sticks.move) {
        const s = G2.sticks.move, R = 56;
        s.x = p.x; s.y = p.y;
        s.dx = clamp((p.x - s.ox) / R, -1, 1);
        s.dy = clamp((p.y - s.oy) / R, -1, 1);
      } else if (rec.kind === 'aim' && G2.sticks.aim) {
        const s = G2.sticks.aim, R = 50;
        s.x = p.x; s.y = p.y;
        s.dx = clamp((p.x - s.ox) / R, -1, 1);
        s.dy = clamp((p.y - s.oy) / R, -1, 1);
      }
    }
  }, { passive: false });

  const endTouch = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const rec = G2.pointers.get(t.identifier);
      G2.pointers.delete(t.identifier);
      if (!rec) continue;
      if (rec.kind === 'btn') G2.btn[rec.id] = false;
      else if (rec.kind === 'move') G2.sticks.move = null;
      else if (rec.kind === 'aim') G2.sticks.aim = null;
    }
  };
  cv.addEventListener('touchend', endTouch, { passive: false });
  cv.addEventListener('touchcancel', endTouch, { passive: false });
}

/** Экранные CSS-координаты -> логические. */
function toLogical(cx, cy) {
  const r = G2.cv.getBoundingClientRect();
  return {
    x: (cx - r.left - G2.cssOffX) / G2.cssPx,
    y: (cy - r.top - G2.cssOffY) / G2.cssPx,
  };
}

function btnPos(def) { return { x: G2.vw + def.bx, y: G2.vh + def.by, r: def.r }; }

function hitButton(x, y) {
  for (const d of BTN_DEF) {
    const p = btnPos(d);
    if (dist2(x, y, p.x, p.y) < (p.r + 10) * (p.r + 10)) return d.id;
  }
  return null;
}

/* ------------------------------------------------- состояние управления */

const Ctrl = {
  moveX: 0, run: false, crouch: false, jumpHeld: false, jumpDown: false,
  fire: false, alt: false, aim: { x: 1, y: 0 }, useStick: false, aimStick: null,
  _jumpPrev: false, _btnJumpPrev: false,

  update() {
    const k = G2.keys;
    let mx = 0;
    if (k.KeyA || k.ArrowLeft) mx -= 1;
    if (k.KeyD || k.ArrowRight) mx += 1;
    let run = !!(k.ShiftLeft || k.ShiftRight);
    let crouch = !!(k.KeyS || k.ArrowDown || k.ControlLeft || k.ControlRight);
    let jumpHeld = !!(k.Space || k.KeyW || k.ArrowUp);
    this.jumpDown = jumpHeld && !this._jumpPrev;
    this._jumpPrev = jumpHeld;
    let fire = G2.mouse.down || !!k.KeyF;
    const alt = G2.mouse.rdown || !!k.KeyQ;
    this.useStick = false; this.aimStick = null;

    const ms = G2.sticks.move;
    if (ms) {
      mx = Math.abs(ms.dx) > 0.18 ? ms.dx : 0;
      if (ms.dy < -0.55) jumpHeld = true;
      if (ms.dy > 0.55) crouch = true;
      if (Math.abs(ms.dx) > 0.86) run = true;
    }
    if (G2.btn.fire) fire = true;
    if (G2.btn.jump) { jumpHeld = true; if (!this._btnJumpPrev) this.jumpDown = true; this._btnJumpPrev = true; }
    else this._btnJumpPrev = false;
    if (G2.btn.crouch) crouch = true;

    const as = G2.sticks.aim;
    if (as && (Math.abs(as.dx) > 0.22 || Math.abs(as.dy) > 0.22)) {
      this.aim.x = as.dx; this.aim.y = as.dy;
      this.useStick = true; this.aimStick = as;
    }

    this.moveX = clamp(mx, -1, 1);
    this.run = run; this.crouch = crouch; this.jumpHeld = jumpHeld;
    this.fire = fire; this.alt = alt;
  },
};

/* ---------------------------------------------------------------- помощники рисовки (логические пиксели) */

function rect(ctx, x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function circle(ctx, x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function ring(ctx, x, y, r, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); }
function line(ctx, x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(Math.round(x1), Math.round(y1)); ctx.lineTo(Math.round(x2), Math.round(y2)); ctx.stroke();
}

/** Пиксельная панель: жёсткая рамка со срезанными углами. */
function panel(ctx, x, y, w, h, fill, border, border2) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  if (border) {
    ctx.fillStyle = border;
    ctx.fillRect(x + 2, y, w - 4, h);
    ctx.fillRect(x, y + 2, w, h - 4);
  }
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillRect(x + 1, y + 3, w - 2, h - 6);
  }
  if (border2) {
    ctx.fillStyle = border2;
    ctx.fillRect(x + 2, y + 2, w - 4, 1);
  }
}

/** Пиксельная кнопка. */
function pixBtn(ctx, x, y, w, h, label, state, size) {
  const base = state === 'down' ? '#2a3346' : state === 'hot' ? '#3d4a63' : '#232b3c';
  const edge = state === 'down' ? '#161c28' : '#0e131c';
  const hi = state === 'down' ? '#39445c' : '#4b5a78';
  panel(ctx, x, y, w, h, base, edge, hi);
  const s = size || 9;
  text(ctx, label, x + w / 2, y + h / 2 + s * 0.34, s, state === 'down' ? '#c8d4e8' : '#e8eefa', 'center', true);
}

/** Пиксельный прогресс-бар (сегментами). */
function pixBar(ctx, x, y, w, h, f, col, colBg) {
  f = clamp(f, 0, 1);
  ctx.fillStyle = colBg || '#0c1119';
  ctx.fillRect(x, y, w, h);
  const seg = 2, gap = 1;
  const total = Math.floor((w + gap) / (seg + gap));
  const on = Math.round(total * f);
  ctx.fillStyle = col;
  for (let i = 0; i < on; i++) ctx.fillRect(x + i * (seg + gap), y, seg, h);
}

function text(ctx, s, x, y, size, col, align, bold) {
  return PFONT.draw(ctx, s, x, y, size || 10, col || '#fff', align || 'left', !!bold);
}
function hex(n) { return '#' + ('000000' + (n >>> 0).toString(16)).slice(-6); }

const CELL = 128;

function mkLevel(id, name, desc, theme, w, h, build) {
  const L = {
    id, name, desc, theme, w, h,
    rects: [], solid: [], oneWay: [], hazards: [], deco: [], spawnPts: [],
    crates: [], grid: null,
  };
  /* помощники для описания карты */
  L.box = (x, y, ww, hh, kind, col) => {
    const r = { x, y: y - hh, w: ww, h: hh, kind: kind || 'ground', col: col || 0 };
    L.rects.push(r); return r;
  };
  L.plat = (x, y, ww, kind) => {
    const r = { x, y, w: ww, h: 10, kind: kind || 'plat' };
    L.rects.push(r); return r;
  };
  L.hz = (x, y, ww, hh, kind) => L.hazards.push({ x, y: y - hh, w: ww, h: hh, kind: kind || 'spike' });
  L.spawn = (x, y) => L.spawnPts.push({ x, y: y - 4 });
  L.decoAdd = (x, y, kind, s) => L.deco.push({ x, y, kind, s: s || 1 });

  build(L);

  L.solid = L.rects.filter(r => r.kind !== 'plat');
  L.oneWay = L.rects.filter(r => r.kind === 'plat');
  L.grid = new SpatialGrid(w, h, CELL, L.solid);
  DEST.build(L);
  return L;
}

/* --- пространственная сетка для быстрого поиска статичных прямоугольников --- */
class SpatialGrid {
  constructor(w, h, cell, rects) {
    this.cell = cell;
    this.cw = Math.ceil(w / cell) + 2;
    this.ch = Math.ceil(h / cell) + 2;
    this.buckets = new Array(this.cw * this.ch);
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      const x0 = Math.max(0, Math.floor(r.x / cell)), x1 = Math.min(this.cw - 1, Math.floor((r.x + r.w) / cell));
      const y0 = Math.max(0, Math.floor(r.y / cell)), y1 = Math.min(this.ch - 1, Math.floor((r.y + r.h) / cell));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const k = y * this.cw + x;
        (this.buckets[k] || (this.buckets[k] = [])).push(r);
      }
    }
  }
  query(x, y, w, h, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.max(0, Math.floor(x / c)), x1 = Math.min(this.cw - 1, Math.floor((x + w) / c));
    const y0 = Math.max(0, Math.floor(y / c)), y1 = Math.min(this.ch - 1, Math.floor((y + h) / c));
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
      const b = this.buckets[yy * this.cw + xx];
      if (!b) continue;
      for (let i = 0; i < b.length; i++) if (out.indexOf(b[i]) < 0) out.push(b[i]);
    }
    return out;
  }
}

/** Разрешить движение тела (AABB) по клеткам разрушаемого мира. */
function moveBody(a, dx, dy, L, isPlayer) {
  const res = { hitX: false, hitY: false, ground: false, ceil: false };
  const cw = DEST.cw, ch = DEST.ch;

  /* --- по X --- */
  if (dx !== 0) {
    a.x += dx;
    const cx0 = Math.floor(a.x / cw), cx1 = Math.floor((a.x + a.w - 0.001) / cw);
    const cy0 = Math.floor(a.y / ch), cy1 = Math.floor((a.y + a.h - 0.001) / ch);
    let blocker = -1;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        if (!DEST.solid(cx, cy)) continue;
        if (dx > 0) { if (blocker < 0 || cx < blocker) blocker = cx; }
        else if (cx > blocker) blocker = cx;
      }
    }
    if (blocker >= 0) {
      a.x = dx > 0 ? blocker * cw - a.w : (blocker + 1) * cw;
      res.hitX = true;
      res.wallCell = blocker;
    }
  }

  /* --- по Y --- */
  const prevBottom = a.y + a.h;
  if (dy !== 0) {
    a.y += dy;
    const cx0 = Math.floor(a.x / cw), cx1 = Math.floor((a.x + a.w - 0.001) / cw);
    const cy0 = Math.floor(a.y / ch), cy1 = Math.floor((a.y + a.h - 0.001) / ch);
    let blocker = -1;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        if (!DEST.solid(cx, cy)) continue;
        if (dy > 0) { if (blocker < 0 || cy < blocker) blocker = cy; }
        else if (cy > blocker) blocker = cy;
      }
    }
    if (blocker >= 0) {
      if (dy > 0) { a.y = blocker * ch - a.h; res.ground = true; }
      else a.y = (blocker + 1) * ch;
      res.hitY = true;
    }
    /* односторонние платформы: только падение сверху */
    if (dy > 0 && !res.ground) {
      const feet = a.y + a.h;
      const cyF = Math.floor(feet / ch);
      for (let cx = cx0; cx <= cx1; cx++) {
        const m = DEST.mat(cx, cyF);
        if (!m || !MAT2[m].oneWay) continue;
        if (prevBottom <= cyF * ch + 3 && feet >= cyF * ch) {
          a.y = cyF * ch - a.h; res.ground = true; res.hitY = true; break;
        }
      }
    }
  }
  return res;
}

/** Есть ли твёрдая земля под телом (для ИИ). */
function groundAhead(L, x, y, w, depth) {
  return DEST.hitBox(x, y, w, depth || 6);
}

/** Пересечение отрезка с препятствиями (для пуль). */
function raySolid(L, x0, y0, x1, y1, ignoreOneWay) {
  return DEST.ray(x0, y0, x1, y1);
}

function pointHazard(L, x, y) {
  for (let i = 0; i < L.hazards.length; i++) {
    const h = L.hazards[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}

/* ============================================================
   05 — КАМЕРА, ФОН И БЛОКИ КАРТЫ (пиксельная графика)
   ============================================================ */

const Cam = {
  x: 0, y: 0, tx: 0, ty: 0, shake: 0, shakeX: 0, shakeY: 0, look: 0,

  follow(tx, ty, dt) {
    this.tx = tx; this.ty = ty;
    const k = 1 - Math.pow(0.0018, dt);
    this.x = lerp(this.x, this.tx, k);
    this.y = lerp(this.y, this.ty, k);
    if (this.shake > 0.001) {
      this.shake = Math.max(0, this.shake - dt * 2.4);
      const q = 3;
      this.shakeX = Math.round(rnd(-1, 1) * this.shake * 14 / q) * q;
      this.shakeY = Math.round(rnd(-1, 1) * this.shake * 11 / q) * q;
    } else { this.shakeX = this.shakeY = 0; }
  },
  add(s) { this.shake = Math.min(1.4, this.shake + s); },
  left() { return Math.round(this.x - G2.vw / 2) + this.shakeX; },
  top() { return Math.round(this.y - G2.vh / 2) + this.shakeY; },
};

const REND = {
  /* ---------------- фон: полосатое небо + ступенчатый параллакс ---------------- */
  sky(L) {
    const ctx = G2.ctx, th = THEMES[L.theme] || THEMES.day;
    const BANDS = 18;
    for (let i = 0; i < BANDS; i++) {
      const f = i / (BANDS - 1);
      const c = mixCol(th.sky[0], th.sky[1], f);
      rect(ctx, 0, Math.floor(i * G2.vh / BANDS), G2.vw, Math.ceil(G2.vh / BANDS) + 1, c);
    }

    /* солнце / луна — ступенчатый кружок */
    const sunX = Math.round(G2.vw * 0.78), sunY = Math.round(G2.vh * 0.19 - Cam.y * 0.02);
    if (th.sun) {
      for (let r = 34; r > 0; r -= 4) {
        const a = 0.05 + (1 - r / 34) * 0.10;
        circle(ctx, sunX, sunY, r, 'rgba(255,238,180,' + a.toFixed(2) + ')');
      }
      pixDisc(ctx, sunX, sunY, 13, '#fff8d8');
      pixDisc(ctx, sunX, sunY, 9, '#fffdf0');
    } else {
      pixDisc(ctx, sunX, sunY, 15, '#e2ecff');
      pixDisc(ctx, sunX + 5, sunY - 4, 12, mixCol(th.sky[0], th.sky[1], 0.15));
      for (let i = 0; i < 40; i++) {
        const sx = (i * 137.5) % G2.vw, sy = (i * 61.7) % Math.round(G2.vh * 0.66);
        const s = (i % 7 === 0) ? 2 : 1;
        rect(ctx, sx, sy, s, s, 'rgba(255,255,255,' + (0.22 + (i % 4) * 0.16).toFixed(2) + ')');
      }
    }

    /* облака (медленный параллакс) */
    if (th.sun) {
      const co = Cam.left() * 0.06;
      for (let i = 0; i < 7; i++) {
        const cw2 = 60 + (i % 3) * 34;
        const cx2 = Math.round(((i * 197) - co * 0.6) % (G2.vw + 240)) - 120;
        const cy2 = Math.round(28 + (i * 53) % 90 - Cam.top() * 0.03);
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx2, cy2 + 6, cw2, 7);
        ctx.fillRect(cx2 + 10, cy2, cw2 - 24, 8);
        ctx.fillRect(cx2 + 22, cy2 - 5, cw2 - 42, 7);
        ctx.globalAlpha = 0.30;
        ctx.fillStyle = '#c8d8ee';
        ctx.fillRect(cx2, cy2 + 12, cw2, 3);
        ctx.globalAlpha = 1;
      }
    }

    /* три слоя ступенчатых гор */
    const layers = [
      { k: 0.12, col: shadeRGB(th.far, 1.02), amp: 52, base: 0.70, step: 16, seed: 0 },
      { k: 0.26, col: shadeRGB(th.mid, 1.00), amp: 78, base: 0.80, step: 12, seed: 977 },
      { k: 0.46, col: shadeRGB(th.mid, 0.68), amp: 104, base: 0.90, step: 10, seed: 3131 },
    ];
    for (const lay of layers) {
      const off = Cam.left() * lay.k;
      const baseY = Math.round(G2.vh * lay.base - Cam.top() * lay.k * 0.30);
      ctx.fillStyle = lay.col;
      for (let x = -lay.step; x <= G2.vw + lay.step; x += lay.step) {
        const wx = Math.round(x - (((off % lay.step) + lay.step) % lay.step));
        const h = Math.round(lay.amp * (0.5 + 0.5 * Math.sin((x + off) * 0.0019 + lay.seed)) / 4) * 4;
        ctx.fillRect(wx, baseY - h, lay.step + 1, h + G2.vh);
      }
    }

    /* дальняя застройка / деревья — 4-й слой с деталями */
    {
      const off = Cam.left() * 0.60;
      const baseY = Math.round(G2.vh * 0.94 - Cam.top() * 0.18);
      const col = shadeRGB(th.mid, 0.52);
      const col2 = shadeRGB(th.mid, 0.62);
      const STEP = 46;
      for (let x = -STEP; x <= G2.vw + STEP * 2; x += STEP) {
        const wx = Math.round(x - (((off % STEP) + STEP) % STEP));
        const s = Math.abs(((x + (off | 0)) * 2654435761) & 0xffff);
        const kind = s % 3;
        const hh = 34 + (s % 58);
        if (kind === 0) {
          ctx.fillStyle = col;
          ctx.fillRect(wx, baseY - hh, 34, hh + G2.vh);
          ctx.fillStyle = col2;
          ctx.fillRect(wx + 4, baseY - hh + 6, 5, 5);
          ctx.fillRect(wx + 16, baseY - hh + 6, 5, 5);
          ctx.fillRect(wx + 4, baseY - hh + 18, 5, 5);
          ctx.fillRect(wx + 16, baseY - hh + 18, 5, 5);
        } else if (kind === 1) {
          ctx.fillStyle = col;
          ctx.fillRect(wx + 14, baseY - hh * 0.55, 6, hh * 0.55 + G2.vh);
          ctx.fillRect(wx, baseY - hh, 34, 10);
          ctx.fillRect(wx + 2, baseY - hh - 8, 30, 9);
        } else {
          ctx.fillStyle = col;
          ctx.fillRect(wx + 6, baseY - hh, 22, hh + G2.vh);
          ctx.fillStyle = col2;
          ctx.fillRect(wx + 6, baseY - hh, 22, 4);
        }
      }
    }
    /* дымка */
    if (th.fog > 0.02) {
      ctx.fillStyle = 'rgba(' + colToStr(th.sky[1]) + ',' + th.fog + ')';
      ctx.fillRect(0, 0, G2.vw, G2.vh);
    }
  },

  /* ---------------- блоки ---------------- */
  world(L, ctx2) {
    const ctx = ctx2 || G2.ctx;
    const l = Cam.left(), t = Cam.top();
    DEST.draw(ctx, l, t, G2.vw, G2.vh);
    const r = l + G2.vw, b = t + G2.vh;
    for (let i = 0; i < L.hazards.length; i++) {
      const h = L.hazards[i];
      if (h.x > r || h.x + h.w < l || h.y > b || h.y + h.h < t) continue;
      REND.hazard(h, ctx);
    }
  },

  block(L, q, ctx) {
    ctx = ctx || G2.ctx;
    const th = THEMES[L.theme] || THEMES.day;
    const x = Math.round(q.x), y = Math.round(q.y), w = Math.round(q.w), h = Math.round(q.h);
    let top, body, edge, speck;
    switch (q.kind) {
      case 'ground': top = 0x7ba04e; body = 0x6b5238; edge = 0x453322; speck = 0x5c4630; break;
      case 'sand': top = 0xe6cf8c; body = 0xc9ac6c; edge = 0x93794a; speck = 0xb09456; break;
      case 'rock': top = 0x9a9484; body = 0x787265; edge = 0x514c42; speck = 0x66604f; break;
      case 'metal': top = 0xacb6c6; body = 0x7d8798; edge = 0x4c5462; speck = 0x6b7484; break;
      case 'brick': top = 0xbe7268; body = 0x8f5650; edge = 0x5c3a36; speck = 0x7a4741; break;
      case 'concrete': top = 0xb0b0aa; body = 0x8b8b85; edge = 0x5c5c58; speck = 0x767670; break;
      case 'glass': top = 0xc6ecf7; body = 0x8fc9dd; edge = 0x5a91a8; speck = 0x7fb8cc; break;
      case 'shelf': top = 0xa07c42; body = 0x7d5e30; edge = 0x4f3c1d; speck = 0x664c26; break;
      case 'crate': top = 0xd9a052; body = 0xa87a38; edge = 0x6b4d1f; speck = 0x8c642c; break;
      case 'barrel': top = 0xd85a46; body = 0xa84031; edge = 0x6b271c; speck = 0x8c3427; break;
      case 'roof': top = 0x7f7f88; body = 0x5d5d66; edge = 0x393940; speck = 0x4c4c54; break;
      case 'floor': top = 0x74929f; body = 0x566d78; edge = 0x33434b; speck = 0x465c66; break;
      case 'wall': top = 0x666c7c; body = 0x4c515e; edge = 0x2c3038; speck = 0x3e424e; break;
      case 'door': top = 0x6f4a2c; body = 0x52351c; edge = 0x31200f; speck = 0x432a15; break;
      default: top = 0x7a7a82; body = 0x5e5e66; edge = 0x3c3c44; speck = 0x4c4c54;
    }
    const li = th.light;
    rect(ctx, x, y, w, h, shadeRGB(body, li));
    /* верхняя кромка */
    rect(ctx, x, y, w, 4, shadeRGB(top, li));
    rect(ctx, x, y, w, 2, shadeRGB(top, li * 1.22));
    /* боковые грани */
    rect(ctx, x, y, 2, h, shadeRGB(top, li * 0.86));
    rect(ctx, x + w - 2, y, 2, h, shadeRGB(edge, li * 1.1));
    /* пиксельная фактура */
    ctx.fillStyle = shadeRGB(speck, li);
    if (q.kind === 'crate' || q.kind === 'shelf') {
      ctx.fillRect(x + 3, y + 5, w - 6, 2);
      ctx.fillRect(x + 3, y + h - 7, w - 6, 2);
      ctx.fillRect(x + 3, y + 5, 2, h - 10);
      ctx.fillRect(x + w - 5, y + 5, 2, h - 10);
    } else if (q.kind === 'brick' || q.kind === 'concrete') {
      for (let yy = y + 10; yy < y + h - 2; yy += 12) {
        ctx.fillRect(x, yy, w, 2);
        const off2 = (((yy / 12) | 0) % 2) ? 10 : 0;
        for (let xx = x + off2; xx < x + w - 2; xx += 20) ctx.fillRect(xx, yy, 2, 12);
      }
    } else if (q.kind === 'metal') {
      ctx.fillRect(x + 2, y + 9, w - 4, 2);
      for (let xx = x + 6; xx < x + w - 6; xx += 18) ctx.fillRect(xx, y + 6, 2, 2);
    } else if (q.kind === 'roof' || q.kind === 'floor') {
      for (let xx = x + 4; xx < x + w - 4; xx += 14) ctx.fillRect(xx, y + 8, 6, 2);
    } else {
      let s = (x * 7919 + y * 104729) & 0xffff;
      const n = Math.min(18, (w * h) / 900 | 0);
      for (let i = 0; i < n; i++) {
        s = (s * 1103515245 + 12345) & 0x7fffffff;
        const px = x + 3 + (s % Math.max(1, w - 6));
        s = (s * 1103515245 + 12345) & 0x7fffffff;
        const py = y + 5 + (s % Math.max(1, h - 8));
        ctx.fillRect(px, py, 2, 2);
      }
    }
    rect(ctx, x, y + h - 2, w, 2, shadeRGB(edge, li * 0.85));
  },

  hazard(h, ctx) {
    ctx = ctx || G2.ctx;
    const x = Math.round(h.x), y = Math.round(h.y), w = Math.round(h.w), hh = Math.round(h.h);
    if (h.kind === 'spike') {
      ctx.fillStyle = '#dbe4ee';
      for (let px = x; px < x + w; px += 8) {
        ctx.beginPath();
        ctx.moveTo(px, y + hh); ctx.lineTo(px + 4, y); ctx.lineTo(px + 8, y + hh);
        ctx.fill();
      }
      ctx.fillStyle = '#8f9aa8';
      for (let px = x + 4; px < x + w; px += 8) ctx.fillRect(px, y + 2, 1, hh - 2);
    } else if (h.kind === 'pit') {
      ctx.fillStyle = '#07040b';
      ctx.fillRect(x, y, w, hh);
      ctx.fillStyle = '#140c1e';
      ctx.fillRect(x, y, w, 3);
    } else {
      const col = h.kind === 'acid' ? '#8ce03c' : '#ff6a1e';
      ctx.fillStyle = col;
      ctx.fillRect(x, y, w, hh);
      ctx.fillStyle = h.kind === 'acid' ? '#c6ff7a' : '#ffc15a';
      ctx.fillRect(x, y, w, 3);
      for (let i = 0; i < 6; i++) {
        const bx = x + ((i * 37 + ((G2.time * 40) | 0)) % w);
        const by = y - ((Math.sin(G2.time * 3 + i) * 0.5 + 0.5) * 8 + 2);
        ctx.fillRect(bx, by, 3, 3);
      }
    }
  },
};

/* --------- вспомогательные --------- */
function mixCol(a, b, f) {
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  return 'rgb(' + ((ar + (br - ar) * f) | 0) + ',' + ((ag + (bg - ag) * f) | 0) + ',' + ((ab + (bb - ab) * f) | 0) + ')';
}
function colToStr(n) { return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255); }

/** Ступенчатый круг (пиксельный). */
function pixDisc(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y += 2) {
    const w = Math.sqrt(Math.max(0, r * r - y * y));
    ctx.fillRect(cx - w, cy + y, w * 2, 2);
  }
}
