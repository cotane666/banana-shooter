/* ============================================================
   06 — РИСОВАНИЕ ПЕРСОНАЖЕЙ: солдат, зомби всех типов, силуэты оружия
   Процедурная векторная графика в стиле пиксель-арта: ничего не грузим.
   ============================================================ */

/** Силуэт оружия по категории. Рисуется справа от точки (0,0), длина L. */
function drawGunShape(ctx, cat, L, id, light) {
  ctx.save();
  const steel = light ? '#8f98a8' : '#3a4048', dark = light ? '#5a6272' : '#22262c',
        wood = light ? '#b8843f' : '#7a4f28', olive = light ? '#7d8a5e' : '#4a5238', gold = '#e8b23a';
  if (cat === 'drill') {
    /* корпус бура */
    rect(ctx, -1, -4, L * 0.42, 8, steel);
    rect(ctx, -1, -4, L * 0.42, 2, '#c8d2de');
    rect(ctx, -3, 3, 6, 7, dark);
    rect(ctx, L * 0.30, -5.5, L * 0.16, 11, olive);
    /* спираль-конус */
    const spin = ((G2.time * 26) | 0) % 2;
    for (let i = 0; i < 7; i++) {
      const w = 9 - i * 1.15;
      rect(ctx, L * 0.42 + i * 2.6, -w / 2, 2.7, w, (i + spin) % 2 ? '#c8d2de' : '#7d8798');
    }
    rect(ctx, L * 0.42 + 18, -1, 4, 2, '#e8f0ff');
    ctx.restore(); return;
  }
  let body = steel;
  if (cat === 'rifle' || cat === 'lmg' || cat === 'heavy') body = steel;
  if (cat === 'sniper') body = '#2f343c';
  if (cat === 'shotgun') body = '#4a3a2a';
  if (cat === 'banana') body = gold;
  if (cat === 'melee') {
    rect(ctx, 0, -1.6, L * 0.75, 3.2, '#6b7480');
    if (id === 'machete' || id === 'katana' || id === 'knightsword' || id === 'knightsword2' || id === 'knightsword3')
      rect(ctx, L * 0.45, -1.2, L * 0.85, 2.4, '#dfe6ef');
    if (id === 'axe' || id === 'megahammer' || id === 'hammer')
      rect(ctx, L * 0.62, -4.5, 6, 9, '#9aa2ac');
    if (id === 'chainsaw') { rect(ctx, L * 0.6, -3, L * 0.7, 6, '#c8503f'); }
    ctx.restore(); return;
  }
  /* ствольная коробка */
  rect(ctx, 0, -3, L * 0.5, 6, body);
  /* ствол */
  rect(ctx, L * 0.5, -1.6, L * 0.42, 3.2, body);
  /* магазин */
  if (cat === 'pistol') rect(ctx, L * 0.10, 3, 4, 7, dark);
  else rect(ctx, L * 0.28, 3, 6, 8, dark);
  /* рукоять */
  rect(ctx, -1, 2.5, 5, 7, dark);
  /* приклад */
  if (cat === 'rifle' || cat === 'sniper' || cat === 'lmg' || cat === 'shotgun' || cat === 'heavy')
    rect(ctx, -L * 0.28, -2.6, L * 0.3, 5, cat === 'shotgun' ? wood : body);
  /* оптика */
  if (cat === 'sniper') rect(ctx, L * 0.18, -7, L * 0.24, 3.4, '#1a1e24');
  if (id === 'laser' || id === 'laserCannon') rect(ctx, L * 0.5, -1.8, L * 0.2, 3.6, '#ff6a2a');
  if (id === 'minigun' || id === 'yhs') { rect(ctx, L * 0.5, -3.5, L * 0.3, 7, '#6b7480'); rect(ctx, L * 0.8, -3.5, 3, 7, '#4a5058'); }
  if (id === 'rpg' || id === 'atomicRpg' || id === 'rocketgun') { rect(ctx, L * 0.3, -5, L * 0.6, 10, '#4a5238'); }
  if (cat === 'banana') { /* банан на конце */
    ctx.beginPath(); ctx.arc(L * 0.92, -1, 5, -1.0, 1.6); ctx.lineTo(L * 0.92, 2.5); ctx.fillStyle = gold; ctx.fill();
  }
  ctx.restore();
}

/** Человекоподобная фигура. Рисуется списком прямоугольников в два прохода:
    сначала тёмный силуэт на 1px больше — получается честный пиксельный контур. */
function drawHuman(ctx, x, y, o) {
  const s = o.scale || 1;
  const face = o.face || 1;
  const walk = o.walk || 0;
  const ch = o.crouch ? 0.72 : 1;
  const H = 38 * s * ch;
  const OUT = '#0a0d14';
  const skin = o.skin || '#e0b083';
  const skinD = shade2(skin, 0.78);
  const cloth = o.cloth || '#4a7fb5';
  const clothD = shade2(cloth, 0.74);
  const pants = o.pants || '#3a4a68';
  const pantsD = shade2(pants, 0.72);
  const boot = '#22262e';
  const P = [];

  const put = (px, py, w, h, col) => P.push([px, py, w, h, col]);

  /* ноги: бедро + голень, шагают в противофазе */
  const l1 = walk, sw = Math.sin(l1) * 4.5 * s, sw2 = Math.sin(l1 + Math.PI) * 4.5 * s;
  const hipY = -H * 0.46;
  put(-4.4 * s, hipY, 3.8 * s, H * 0.25, pants);
  put(0.6 * s, hipY, 3.8 * s, H * 0.25, pantsD);
  put(-4.4 * s + sw, hipY + H * 0.23, 4.2 * s, H * 0.21, pants);
  put(0.6 * s + sw2, hipY + H * 0.23, 4.2 * s, H * 0.21, pantsD);
  const footY = hipY + H * 0.42;
  put(-5.2 * s + sw, footY, 5.6 * s, 3.4 * s, boot);
  put(-2.6 * s + sw2, footY, 5.6 * s, 3.4 * s, shade2(boot, 0.8));

  /* корпус */
  const bodyY = -H * 0.74;
  put(-5.6 * s, bodyY, 11.2 * s, H * 0.30, cloth);
  put(-5.6 * s, bodyY, 11.2 * s, 3 * s, shade2(cloth, 1.18));
  put(-6.2 * s, bodyY + H * 0.06, 12.4 * s, H * 0.16, '#2b3140');   // бронежилет
  put(-6.2 * s, bodyY + H * 0.06, 12.4 * s, 2, shade2('#2b3140', 1.35));
  put(-4.4 * s, bodyY + H * 0.24, 8.8 * s, 2.6 * s, '#1c212b');     // ремень

  /* руки: ступенчатая «лестница» к направлению прицела */
  const ax = o.aimX === undefined ? 1 : o.aimX;
  const ay = o.aimY === undefined ? 0 : o.aimY;
  const a = Math.atan2(ay, ax);
  const R = 9 * s;
  for (let i = 0; i < 3; i++) {
    const t = i / 3;
    const px = Math.cos(a) * R * t;
    const py = Math.sin(a) * R * t;
    put(px - 1.8 * s, bodyY + H * 0.10 + py - 1.8 * s, 4.4 * s, 4.4 * s, i === 2 ? skin : cloth);
  }
  /* задняя рука */
  put(-Math.cos(a) * 3 * s - 2 * s, bodyY + H * 0.14, 4 * s, 4 * s, clothD);
  put(Math.cos(a) * R * 0.8 - 2 * s, bodyY + H * 0.10 + Math.sin(a) * R * 0.8 - 2 * s, 4.2 * s, 4.2 * s, skin);

  /* голова + шлем */
  const headY = -H * 0.95;
  put(-4.2 * s, headY, 8.4 * s, 8.4 * s, skin);
  put(-4.2 * s, headY + 4.6 * s, 8.4 * s, 2 * s, skinD);
  put(1.2 * s, headY + 2.4 * s, 2.6 * s, 1.8 * s, '#1a1e24');        // глаз
  put(-5 * s, headY - 2.6 * s, 10 * s, 5 * s, o.helmet || '#41522f');
  put(-5 * s, headY - 2.6 * s, 10 * s, 1.6 * s, shade2(o.helmet || '#41522f', 1.3));
  put(4.2 * s, headY - 0.6 * s, 1.8 * s, 3 * s, shade2(o.helmet || '#41522f', 0.8));

  /* контур + заливка */
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(face, 1);
  ctx.fillStyle = OUT;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    ctx.fillRect(Math.round(p[0]) - 1, Math.round(p[1]) - 1, Math.ceil(p[2]) + 2, Math.ceil(p[3]) + 2);
  }
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    ctx.fillStyle = p[4];
    ctx.fillRect(Math.round(p[0]), Math.round(p[1]), Math.ceil(p[2]), Math.ceil(p[3]));
  }
  ctx.restore();
}

function shade2(c, f) {
  f = f || 0.78;
  if (c[0] !== '#') return c;
  const n = parseInt(c.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) * f, 0, 255) | 0;
  const b = clamp((n & 255) * f, 0, 255) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/** Зомби: силуэт + детали по типу. Два прохода — контур, затем заливка. */
function drawZombie(ctx, z) {
  const d = z.def || ZOMBIES[z.type] || ZOMBIES.walker;
  const s = (d.scale || 1) * (z.elite ? 1.14 : 1);
  const face = z.face || 1;
  const t = z.anim || 0;
  const OUT = '#080b10';
  const base = hex(d.color);
  const cloth = shade2(base, 0.66);
  const clothD = shade2(base, 0.50);
  const skin = shade2(base, 1.18);
  const skinD = shade2(base, 0.92);

  const big = !!d.miniBoss || !!d.boss;
  const H = 34 * s;
  const P = [];
  const put = (px, py, w, h, col) => P.push([px, py, w, h, col]);

  const l1 = t * 6.5 * (d.speed > 3 ? 1.5 : 1);
  const sw = Math.sin(l1) * 4 * s, sw2 = Math.sin(l1 + Math.PI) * 4 * s;
  const hipY = -H * 0.44;
  const low = z.type === 'crawler';

  /* ноги (у ползуна — короткие «лапы») */
  const legH = low ? H * 0.18 : H * 0.30;
  put(-4 * s, hipY, 3.6 * s, legH, cloth);
  put(0.4 * s, hipY, 3.6 * s, legH, clothD);
  put(-4.6 * s + sw, hipY + legH - 1, 4.4 * s, 3.2 * s, shade2(base, 0.55));
  put(-0.4 * s + sw2, hipY + legH - 1, 4.4 * s, 3.2 * s, shade2(base, 0.48));

  /* корпус: сутулый, у толстяка/громилы шире */
  const bodyW = (z.type === 'tank' || z.type === 'brute' || big ? 13 : 11) * s;
  const bodyH = (z.type === 'tank' ? 0.42 : 0.34) * H;
  const bodyY = -H * 0.72;
  put(-bodyW / 2, bodyY, bodyW, bodyH, cloth);
  put(-bodyW / 2, bodyY, bodyW, 2.6 * s, shade2(base, 0.86));
  /* рёбра-потёртости */
  put(-bodyW / 2 + 1.5 * s, bodyY + bodyH * 0.35, bodyW - 3 * s, 1.6 * s, clothD);
  put(-bodyW / 2 + 2.5 * s, bodyY + bodyH * 0.62, bodyW - 5 * s, 1.6 * s, clothD);

  /* руки вперёд (у летуна — как крылья-перепонки) */
  const reach = (d.flying ? 13 : 15) * s;
  const sway = Math.sin(t * 4.5) * 1.6 * s;
  put(0, bodyY + 3 * s + sway, reach, 4.6 * s, skin);
  put(reach - 2 * s, bodyY + 2 * s + sway, 4.6 * s, 5.6 * s, shade2(skin, 1.12));
  put(-3 * s, bodyY + 6 * s - sway, reach * 0.8, 4.2 * s, skinD);
  put(reach * 0.8 - 3.5 * s, bodyY + 5 * s - sway, 4.2 * s, 5 * s, skinD);

  /* голова вытянута вперёд, с открытой пастью */
  const headY = -H * 0.90;
  put(1 * s, headY, 9.5 * s, 8 * s, skin);
  put(1 * s, headY + 6 * s, 9.5 * s, 2 * s, skinD);
  put(6 * s, headY + 3.4 * s, 4 * s, 3 * s, skinD);          // челюсть
  put(7 * s, headY + 3.8 * s, 3 * s, 1.4 * s, '#2a0a0c');    // пасть
  put(3.6 * s, headY + 1.4 * s, 2.6 * s, 2.4 * s, d.brain ? '#ffd8e6' : '#f2e04a');  // глаз
  put(4.2 * s, headY + 1.8 * s, 1.2 * s, 1.4 * s, '#1a0a04'); // зрачок
  put(1 * s, headY - 1, 9.5 * s, 1.8 * s, shade2(skin, 0.7));

  /* особенности типов */
  if (z.type === 'robot') {
    put(-6 * s, bodyY + 1, 12 * s, 3 * s, '#c8d2de');
    put(-4 * s, headY - 1, 8 * s, 2 * s, '#8b95a1');
    put(3.6 * s, headY + 1.4 * s, 2.8 * s, 2.4 * s, '#ff3a2a');
  }
  if (z.type === 'shielder') {
    put(9 * s, bodyY - 1, 3 * s, H * 0.5, '#8fa4c4');
    put(9 * s, bodyY - 1, 3 * s, 2 * s, '#c8d8ee');
  }
  if (z.type === 'spitter') {
    put(-6 * s, bodyY + 4 * s, 5 * s, 5 * s, '#a8d84a');
    put(-6 * s, bodyY + 4 * s, 5 * s, 2 * s, '#ccf07a');
  }
  if (z.type === 'bomber') {
    const bl = (Math.sin(t * 12) > 0) ? '#ff5a3a' : '#8a2a1a';
    put(-4 * s, bodyY + 5 * s, 8 * s, 6 * s, bl);
    put(-2 * s, bodyY + 7 * s, 4 * s, 2 * s, '#ffd24a');
  }
  if (d.aura) {
    put(-bodyW / 2 - 1.5 * s, bodyY + bodyH * 0.2, 1.6 * s, bodyH * 0.6, hex(d.aura));
  }
  /* ранение — тёмные подтёки */
  if (z.hurtT > 0 || (z.hp < z.maxHp * 0.6)) {
    const sc = (z.hp < z.maxHp * 0.35) ? 3 : 2;
    for (let i = 0; i < sc; i++) {
      const rx = (i * 3.1 % bodyW) - bodyW / 2 + 1;
      put(rx, bodyY + (i * 4.7 % bodyH), 2.4 * s, 2.4 * s, '#7a0f18');
    }
  }

  ctx.save();
  ctx.translate(z.x + z.w / 2, z.y + z.h);
  ctx.scale(face, 1);
  if (z.hurtT > 0) ctx.globalAlpha = 0.92;
  ctx.fillStyle = OUT;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    ctx.fillRect(Math.round(p[0]) - 1, Math.round(p[1]) - 1, Math.ceil(p[2]) + 2, Math.ceil(p[3]) + 2);
  }
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    ctx.fillStyle = p[4];
    ctx.fillRect(Math.round(p[0]), Math.round(p[1]), Math.ceil(p[2]), Math.ceil(p[3]));
  }
  /* вспышка урона */
  if (z.hurtT > 0) {
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      ctx.fillRect(Math.round(p[0]), Math.round(p[1]), Math.ceil(p[2]), Math.ceil(p[3]));
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* аура мини-боссов */
  if (big) {
    const cx = z.x + z.w / 2, cy = z.y + z.h - H * 0.9;
    const aura = d.aura || 0xff6a2a;
    const pu = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.globalAlpha = 0.30 + pu * 0.16;
    ring(ctx, cx, cy + H * 0.45, H * 0.62 + pu * 3, 2, hex(aura));
    ctx.globalAlpha = 1;
  }
}

/** Полоска здоровья над врагом. */
function drawHpBar(ctx, x, y, w, hp, maxHp, col) {
  const f = clamp(hp / maxHp, 0, 1);
  rect(ctx, x - 1, y - 1, w + 2, 5, 'rgba(0,0,0,.65)');
  rect(ctx, x, y, w * f, 3, col || (f > 0.5 ? '#6de06d' : f > 0.22 ? '#e8c23a' : '#e05a4a'));
}

/** Простой силуэт-иконка оружия для магазина (замена 3D-рендера). */
function shopWeaponIcon(ctx, id, x, y, w, h) {
  const wp = WEAPONS[id];
  if (!wp) return;
  ctx.save();
  ctx.translate(x + w * 0.18, y + h * 0.55);
  const L = w * 0.62;
  ctx.save();
  drawGunShape(ctx, wp.cat, L, id);
  ctx.restore();
  ctx.restore();
}

/* ============================================================
   07 — ЭФФЕКТЫ: частицы, следы, всплывающие числа, вспышки
   ============================================================ */

const FX = {
  parts: [],
  decals: [],
  texts: [],
  rings: [],
  MAX: 900,

  clear() { this.parts.length = 0; this.decals.length = 0; this.texts.length = 0; this.rings.length = 0; },

  spawn(x, y, vx, vy, life, col, size, grav, kind) {
    if (this.parts.length >= this.MAX) this.parts.shift();
    this.parts.push({
      x, y, vx, vy, life, max: life, col, size: size || 2,
      grav: grav === undefined ? 420 : grav, kind: kind || 'p',
    });
  },

  burst(x, y, n, col, spd, size, grav) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, s = spd * (0.35 + Math.random() * 0.85);
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.25, 0.6), col, size || 2, grav === undefined ? 520 : grav);
    }
  },

  blood(x, y, dx, dy, n, gore) {
    const cnt = gore === false ? Math.min(n, 3) : n;
    for (let i = 0; i < cnt; i++) {
      const a = Math.atan2(dy, dx) + rnd(-0.9, 0.9), s = rnd(60, 280);
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - rnd(0, 90), rnd(0.35, 0.9),
        pick(gore === false ? ['#a01419'] : ['#c01824', '#8a0f18', '#e0332c']), rnd(1, 3), 700, 'blood');
    }
  },

  smoke(x, y, n, col, up) {
    for (let i = 0; i < n; i++) {
      this.spawn(x + rnd(-4, 4), y + rnd(-4, 4), rnd(-24, 24), (up ? -1 : 1) * rnd(10, 46),
        rnd(0.5, 1.3), col || 'rgba(120,120,130,.55)', rnd(3, 6), -12, 'smoke');
    }
  },

  dust(x, y, n, dir) {
    for (let i = 0; i < n; i++) {
      this.spawn(x + rnd(-5, 5), y - rnd(0, 3), (dir || 0) * rnd(10, 60) + rnd(-30, 30), rnd(-50, -8),
        rnd(0.25, 0.6), pick(['#c9b58c', '#a89474', '#8d7a5c']), rnd(1, 3), 520);
    }
  },

  /** Куски породы от разрушения — летят и падают. */
  debris(x, y, n, size) {
    for (let i = 0; i < n; i++) {
      this.spawn(x + rnd(-5, 5), y + rnd(-5, 5), rnd(-140, 140), rnd(-230, -70),
        rnd(0.5, 1.1), pick(['#8a7a60', '#6b5238', '#a89070', '#5c4630']),
        size || 3, 900, 'debris');
    }
  },

  /** Гильза от выстрела. */
  casing(x, y, dir) {
    this.spawn(x, y, -dir * rnd(40, 90), rnd(-140, -70), rnd(0.6, 1.0), '#d8b45a', 2, 900, 'debris');
  },

  tracer(x1, y1, x2, y2, col) {
    this.spawn(x1, y1, 0, 0, 0.06, col || '#ffe08a', 1, 0, 'tracer');
    this.parts[this.parts.length - 1].x2 = x2;
    this.parts[this.parts.length - 1].y2 = y2;
  },

  ring(x, y, r, col, life) { this.rings.push({ x, y, r: 0, rMax: r, life: life || 0.35, max: life || 0.35, col }); },

  decal(x, y, col, size) {
    if (this.decals.length > 220) this.decals.shift();
    this.decals.push({ x: Math.round(x), y: Math.round(y), col, size: size || 2, a: 1 });
  },

  num(x, y, val, col, big) {
    if (this.texts.length > 60) this.texts.shift();
    this.texts.push({ x, y, v: Math.round(val), col: col || '#fff', life: 0.75, max: 0.75, big: !!big, vy: -46 });
  },

  label(x, y, str, col, life) {
    if (this.texts.length > 60) this.texts.shift();
    this.texts.push({ x, y, s: str, col: col || '#fff', life: life || 1.2, max: life || 1.2, vy: -30 });
  },

  update(dt) {
    const P = this.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.life -= dt;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      if (p.kind !== 'tracer') {
        p.vy += p.grav * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.kind === 'blood' || p.kind === 'p') {
          const g = FX._ground(p.x, p.y);
          if (g) { FX.decal(p.x, g, p.kind === 'blood' ? '#7a0d14' : '#00000040', p.kind === 'blood' ? 2 : 1); p.life = 0; }
        }
      }
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
      else r.r = r.rMax * (1 - r.life / r.max);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt; t.y += t.vy * dt; t.vy *= 0.92;
      if (t.life <= 0) this.texts.splice(i, 1);
    }
    for (let i = this.decals.length - 1; i >= 0; i--) {
      this.decals[i].a -= dt * 0.06;
      if (this.decals[i].a <= 0) this.decals.splice(i, 1);
    }
  },

  _ground(x, y) {
    const L = Game.L;
    if (!L) return 0;
    const r = { x: x - 1, y: y, w: 2, h: 8 };
    const q = [];
    L.grid.query(r.x, r.y, r.w, r.h, q);
    for (let i = 0; i < q.length; i++) if (aabbHit(r, q[i])) return q[i].y;
    return 0;
  },

  draw(ctx) {
    /* следы */
    for (let i = 0; i < this.decals.length; i++) {
      const d = this.decals[i];
      ctx.globalAlpha = Math.min(1, d.a);
      rect(ctx, d.x, d.y, d.size, d.size, d.col);
    }
    ctx.globalAlpha = 1;
    /* частицы */
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      if (p.kind === 'tracer') {
        ctx.strokeStyle = p.col; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x2, p.y2); ctx.stroke();
        continue;
      }
      if (p.kind === 'smoke') {
        ctx.globalAlpha = Math.min(1, p.life / p.max) * 0.6;
        circle(ctx, p.x, p.y, p.size, p.col);
        ctx.globalAlpha = 1;
        continue;
      }
      rect(ctx, p.x, p.y, p.size, p.size, p.col);
    }
    /* кольца ударной волны */
    for (let i = 0; i < this.rings.length; i++) {
      const r = this.rings[i];
      ctx.globalAlpha = Math.max(0, r.life / r.max) * 0.8;
      ring(ctx, r.x, r.y, r.r, 2, r.col);
      ctx.globalAlpha = 1;
    }
  },

  drawTexts(ctx) {
    for (let i = 0; i < this.texts.length; i++) {
      const t = this.texts[i];
      const a = Math.min(1, t.life / t.max * 1.6);
      ctx.globalAlpha = a;
      if (t.s !== undefined) text(ctx, t.s, t.x, t.y, t.big ? 12 : 9, t.col, 'center', true);
      else text(ctx, String(t.v), t.x, t.y, t.big ? 13 : 10, t.col, 'center', true);
      ctx.globalAlpha = 1;
    }
  },
};


/* ===== 08-weapons.js ===== */
/* ============================================================
   08 — ОРУЖИЕ: стрельба, снаряды, ближний бой, луч, щит
   Всё строится автоматически по таблице WEAPONS из оригинала.
   ============================================================ */

const BULLETS = {
  list: [],

  clear() { this.list.length = 0; },

  spawn(o) {
    if (this.list.length > 420) this.list.shift();
    this.list.push(o);
    return o;
  },

  update(dt, G) {
    const L = G.L, arr = this.list;
    for (let i = arr.length - 1; i >= 0; i--) {
      const b = arr[i];
      b.life -= dt;
      if (b.life <= 0) { arr.splice(i, 1); continue; }

      if (b.grav) b.vy += b.grav * dt;
      if (b.homing) {
        const tg = G.nearestEnemyTo(b.x, b.y, 260, b.owner === 'z' ? 'p' : 'e');
        if (tg) {
          const dx = (tg.x + tg.w / 2) - b.x, dy = (tg.y + tg.h / 2) - b.y;
          const a = Math.atan2(dy, dx), ca = Math.atan2(b.vy, b.vx);
          let da = a - ca; while (da > Math.PI) da -= 6.2832; while (da < -Math.PI) da += 6.2832;
          const na = ca + clamp(da, -3.4 * dt, 3.4 * dt);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
        }
      }
      if (b.spin !== undefined) b.spin += dt * 14;

      /* движение подшагами, чтобы не проскакивать сквозь стены */
      const steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 7));
      const sdt = dt / steps;
      let dead = false;
      for (let s = 0; s < steps && !dead; s++) {
        const px = b.x, py = b.y;
        b.x += b.vx * sdt; b.y += b.vy * sdt;

        /* стены */
        if (b.wall !== false) {
          const hit = raySolid(L, px, py, b.x, b.y, true);
          if (hit) { BULLETS.impact(b, G, hit.x, hit.y, true, hit); dead = true; break; }
        }
        /* выход за границы карты */
        if (b.x < -40 || b.x > L.w + 40 || b.y < -60 || b.y > L.h + 60) { dead = true; break; }

        /* попадание */
        if (b.owner === 'p') {
          const z = G.enemyAt(b.x, b.y, b.hitR || 3);
          if (z) { if (G.hitEnemy(z, b, b.x, b.y)) dead = true; }
        } else {
          const pl = G.player;
          if (b.hitR === undefined && pl && !pl.dead && !G.playerShield &&
            b.x > pl.x - 3 && b.x < pl.x + pl.w + 3 && b.y > pl.y - 3 && b.y < pl.y + pl.h + 3) {
            G.hurtPlayer(b.dmg, b.x, b.y);
            BULLETS.impact(b, G, b.x, b.y, false);
            dead = true;
          }
        }
      }
      if (dead) arr.splice(i, 1);
    }
  },

  impact(b, G, x, y, onWall, cell) {
    /* пробиваем мир: любая пуля оставляет воронку */
    if (onWall && cell && b.dig) {
      if (cell.m && MAT2[cell.m] && MAT2[cell.m].boom) {
        G.queueBoom(cell.cx * DEST.cw + 4, cell.cy * DEST.ch + 4);
      }
      const n = DEST.carve(cell.cx * DEST.cw + 4, cell.cy * DEST.ch + 4, b.dig, 1);
      if (n) FX.burst(x, y, 4, '#b8a888', 130, 2, 520);
    }
    if (b.splash) {
      G.explode(x, y, b.splash, b.splashDmg, b.owner, b.explCol, b.noSelf);
    } else if (b.acid) {
      G.addAcidPool(x, y, b.acidR, b.acidDps, b.acidLife);
      FX.burst(x, y, 6, '#8ce03c', 90, 2, 300);
    } else if (b.hive) {
      for (let i = 0; i < b.hiveCount; i++) {
        const a = -1.6 + i * (3.2 / b.hiveCount);
        BULLETS.spawn({
          x, y, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, life: 4.5, dmg: b.hiveDmg,
          owner: b.owner, kind: 'drone', col: '#d8a020', size: 3, grav: 0, homing: true, hitR: 3,
        });
      }
      FX.ring(x, y, 22, '#ffd24a', 0.4);
    }
    const col = b.owner === 'p' ? '#ffe08a' : '#ff9a6a';
    FX.burst(x, y, onWall ? 5 : 3, col, 120, 1.6, 260);
    if (onWall && b.owner === 'p') FX.decal(x, y, 'rgba(0,0,0,.45)', 2);
  },

  draw(ctx) {
    const arr = this.list;
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i];
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const nx = b.vx / sp, ny = b.vy / sp;
      const tl = b.trail || 10;
      ctx.strokeStyle = b.col;
      ctx.lineWidth = b.size || 2;
      ctx.beginPath();
      ctx.moveTo(b.x - nx * tl, b.y - ny * tl);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      if (b.big) rect(ctx, b.x - 3, b.y - 3, 6, 6, b.col);
      if (b.kind === 'banana') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.spin || 0);
        rect(ctx, -4, -1.5, 8, 3, '#f2c53d');
        rect(ctx, 3, -1.5, 2, 3, '#8a6a1c');
        ctx.restore();
      }
      if (b.kind === 'drone') {
        rect(ctx, b.x - 3, b.y - 3, 6, 6, '#d8a020');
        rect(ctx, b.x - 1, b.y - 1, 2, 2, '#5a3a08');
      }
    }
  },
};

/* ---------------------------------------------------------------- оружие игрока */

const Weap = {
  /** Состояние боезапаса по каждому стволу в текущем забеге. */
  makeState() { return { mag: {}, reserve: {}, cd: 0, reloadT: 0, reloadFor: null, spin: 0, heat: 0, vent: 0, beamOn: 0, swapT: 0 }; },

  def(id) { return WEAPONS[id]; },

  /** Полный боезапас ствола (магазин + запас). */
  fill(st, id) {
    const w = WEAPONS[id];
    st.mag[id] = w.mag;
    st.reserve[id] = w.reserve;
  },

  ammo(st, id) {
    const w = WEAPONS[id];
    if (w.mag === Infinity) return Infinity;
    return st.mag[id] === undefined ? 0 : st.mag[id];
  },

  reloadTime(id) {
    const w = WEAPONS[id];
    if (w.cat === 'melee') return 0;
    if (w.cat === 'sniper') return 2.6;
    if (w.cat === 'shotgun' || w.cat === 'lmg' || w.cat === 'heavy') return 3.0;
    return 1.9;
  },

  startReload(G, id) {
    const st = G.weap, w = WEAPONS[id];
    if (w.mag === Infinity) return;
    if (st.reloadT > 0) return;
    if ((st.mag[id] || 0) >= w.mag) return;
    if ((st.reserve[id] || 0) <= 0) { Audio3D_SFX.empty(); return; }
    st.reloadT = this.reloadTime(id);
    st.reloadFor = id;
    Audio3D_SFX.reloadStep(0);
  },

  finishReload(G, id) {
    const st = G.weap, w = WEAPONS[id];
    const need = w.mag - (st.mag[id] || 0);
    const take = Math.min(need, st.reserve[id] || 0);
    st.mag[id] = (st.mag[id] || 0) + take;
    st.reserve[id] = (st.reserve[id] || 0) - take;
  },

  update(G, dt) {
    const st = G.weap;
    if (st.cd > 0) st.cd -= dt;
    if (st.reloadT > 0) {
      st.reloadT -= dt;
      if (st.reloadT <= 0) { this.finishReload(G, st.reloadFor); st.reloadFor = null; }
    }
    if (st.heat > 0) st.heat = Math.max(0, st.heat - dt * 0.4);
    if (st.vent > 0) { st.vent -= dt; if (st.vent <= 0) st.heat = 0; }
    if (st.swapT > 0) st.swapT -= dt;
  },

  /** Основной вызов из игрового цикла. */
  tick(G, dt, wantFire, alt) {
    const id = G.weaponId, w = WEAPONS[id], st = G.weap, p = G.player;
    if (w.beam) { this.beam(G, dt, wantFire, alt); return; }
    if (w.drill) { this.drill(G, dt, wantFire); return; }

    const spinNeed = w.spinUp || 0;
    if (wantFire && spinNeed > 0) st.spin = Math.min(spinNeed, st.spin + dt);
    else st.spin = Math.max(0, st.spin - dt * 1.6);

    if (!wantFire || st.reloadT > 0 || st.swapT > 0) return;
    if (st.cd > 0) return;
    if (spinNeed > 0 && st.spin < spinNeed - 0.001) {
      if (Math.random() < 0.25) Audio3D_SFX.minigunSpin(p.x, 0, 0);
      return;
    }

    if (w.mag !== Infinity && (st.mag[id] || 0) <= 0) { this.startReload(G, id); return; }
    this.fire(G, id, w, alt);
  },

  muzzle(G) {
    const p = G.player;
    const ax = p.aimX, ay = p.aimY;
    const mx = p.x + p.w / 2 + ax * 16;
    const my = p.y + p.h - 13 + ay * 12;
    return { x: mx, y: my, ax, ay };
  },

  fire(G, id, w, alt) {
    const st = G.weap, p = G.player, L = G.L;
    const m = this.muzzle(G);
    const rpm = w.rpm || 300;
    st.cd = 60 / rpm + (alt && w.cat === 'sniper' ? 0.25 : 0);

    if (w.shield) { p.shieldOn = 0.9; Audio3D_SFX.laser(); return; }

    if (w.mag !== Infinity) st.mag[id] = (st.mag[id] || 0) - 1;
    G.stats.shots++;

    /* разброс */
    let spread = (w.spread || 0) * (p.onGround ? 1 : 1.7);
    if (Math.abs(p.vx) > 20) spread += (w.moveSpread || 0);
    if (G.ctrl.crouch) spread *= 0.65;

    /* ближний бой */
    if (w.cat === 'melee' || w.melee) {
      this.melee(G, w, m);
      Audio3D_SFX.shot('knife');
      return;
    }

    const pellets = w.pellets || 1;
    let kind = w.projectile || 'bullet';
    for (let i = 0; i < pellets; i++) {
      const a = Math.atan2(m.ay, m.ax) + rnd(-spread, spread) + (pellets > 1 ? rnd(-0.04, 0.04) : 0);
      const spd = w.projectile ? (w.projSpeed || 40) * CFG2.PPM : 1500 + rnd(-90, 90);
      const vx = Math.cos(a) * spd, vy = Math.sin(a) * spd;
      const range = (w.range || 80) * CFG2.PPM;
      kind = w.projectile || 'bullet';

      BULLETS.spawn({
        x: m.x, y: m.y, vx, vy, life: range / spd,
        dmg: w.dmg, owner: 'p', kind,
        col: this.tracerColor(w), size: kind === 'bullet' ? (w.pierce ? 2 : 1.8) : 3,
        dig: kind === 'bullet' ? (w.cat === 'sniper' || w.cat === 'heavy' || w.cat === 'lmg' ? 7 : (w.cat === 'pistol' || w.cat === 'smg' ? 3 : 5)) : 0,
        grav: w.projGravity ? w.projGravity * CFG2.PPM : 0,
        splash: w.splash ? w.splash * CFG2.PPM : 0,
        splashDmg: w.splashDmg || 0,
        explCol: w.explosionColor || null,
        noSelf: w.noSelfDamage || false,
        pierce: !!w.pierce, hitR: w.pierce ? 5 : 3,
        trail: kind === 'bullet' ? 9 : 6,
        big: kind === 'rocket',
        spin: kind === 'banana' ? 0 : undefined,
        acid: kind === 'acid', acidR: (w.acidR || 2.7) * CFG2.PPM, acidDps: w.acidDps, acidLife: w.acidLife,
        hive: kind === 'hive', hiveCount: w.hiveCount || 5, hiveDmg: (w.splashDmg || 40),
        homing: kind === 'guided' || kind === 'hive',
        bulletSplash: w.bulletSplash ? w.bulletSplash * CFG2.PPM : 0,
        bulletSplashDmg: w.bulletSplashDmg || 0,
        bulletExplCol: w.bulletExplosionColor || null,
      });
    }

    /* отдача и эффекты */
    G.recoil = (w.recoil || 1) * 0.6;
    G.muzzleT = 0.05;
    G.muzzleX = m.x; G.muzzleY = m.y;
    Cam.add((w.recoil || 1) * 0.045);
    FX.burst(m.x + m.ax * 6, m.y + m.ay * 6, 2, '#ffe6a0', 90, 1.4, 120);
    FX.casing(m.x - m.ax * 6, m.y - m.ay * 3, m.ax);
    if (w.cat === 'shotgun' || w.cat === 'sniper' || w.cat === 'heavy') FX.smoke(m.x + m.ax * 8, m.y + m.ay * 8, 2, 'rgba(150,150,160,.45)', true);
    const snd = w.sound || 'rifle';
    Audio3D_SFX.shot(snd, p.x, 0, 0);
    if (w.sound === 'banana') { Audio3D_SFX.bananaShot(p.x, 0, 0); G.stats.bananas++; }
    if (kind === 'rocket' || kind === 'guided') Audio3D_SFX.rocketShot(p.x, 0, 0);
    if (w.sound === 'laser') Audio3D_SFX.laser(p.x, 0, 0);
  },

  tracerColor(w) {
    if (w.cat === 'banana') return '#f2c53d';
    if (w.sound === 'laser') return '#ff6a2a';
    if (w.projectile) return '#ffb060';
    return w.cat === 'sniper' ? '#dff2ff' : '#ffe08a';
  },

  melee(G, w, m) {
    const reach = (w.range || 2.4) * CFG2.PPM;
    const cx = m.x + m.ax * reach * 0.5, cy = m.y + m.ay * reach * 0.5;
    let hitAny = false;
    for (const z of G.enemies) {
      if (z.dead) continue;
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      if (dist2(zx, zy, cx, cy) > (reach * 0.62 + Math.max(z.w, z.h) * 0.5) ** 2) continue;
      const dir = (zx - m.x) * m.ax + (zy - m.y) * m.ay;
      if (dir < 0) continue;
      const head = zy < z.y + z.h * 0.30;
      G.hitEnemyDirect(z, w.dmg * (head ? (w.headMul || 1.5) : 1), zx, zy, head, w.knockback || 4, m.ax, m.ay);
      hitAny = true;
    }
    if (w.slamDmg) G.explode(cx, cy, (w.slamR || 6) * CFG2.PPM, w.slamDmg, 'p', null, true);
    FX.burst(cx, cy, hitAny ? 8 : 4, '#e8f0ff', 140, 2, 200);
    FX.ring(m.x + m.ax * 10, m.y + m.ay * 10, reach * 0.6, '#ffffff', 0.16);
  },

  /** БУР: непрерывно прогрызает тоннель в направлении прицела. */
  drill(G, dt, wantFire) {
    const st = G.weap, w = WEAPONS[G.weaponId], p = G.player;
    const m = this.muzzle(G);
    if (!wantFire) { st.beamOn = 0; st.sndT = 0; return; }
    const len = (w.range || 2.6) * CFG2.PPM;
    const R = w.drillR || 9;

    /* проходка по линии */
    const steps = Math.max(2, Math.ceil(len / (R * 0.6)));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      DEST.carve(m.x + m.ax * len * t, m.y + m.ay * len * t, R, 1);
    }
    const ex = m.x + m.ax * len, ey = m.y + m.ay * len;

    /* урон и отбрасывание врагам в тоннеле */
    for (const z of G.enemies) {
      if (z.dead || z.dummy) continue;
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      const proj = (zx - m.x) * m.ax + (zy - m.y) * m.ay;
      if (proj < 0 || proj > len + 6) continue;
      const px = m.x + m.ax * proj, py = m.y + m.ay * proj;
      if (dist2(px, py, zx, zy) < (R + Math.max(z.w, z.h) * 0.5) ** 2) {
        G.hitEnemyDirect(z, (w.drillDps || 200) * dt, zx, zy, false, 0, m.ax, m.ay, true);
        z.vx += m.ax * (w.knockback || 3) * 40 * dt * 60 * 0.02;
        z.vy += m.ay * (w.knockback || 3) * 40 * dt * 60 * 0.02;
      }
    }

    /* эффекты */
    FX.burst(ex, ey, 2, '#c8b8a0', 150, 2, 620);
    if (Math.random() < 0.5) FX.debris(ex, ey, 1, 2);
    FX.spawn(ex, ey, rnd(-30, 30), rnd(-30, 30), 0.2, '#ffe0a0', 2, 0);
    Cam.add(0.03);
    st.sndT = (st.sndT || 0) - dt;
    if (st.sndT <= 0) { st.sndT = 0.2; Audio3D_SFX.minigunSpin(p.x, 0, 0); }
    G.beam = { x1: m.x, y1: m.y, x2: ex, y2: ey, drill: true };
  },

  beam(G, dt, wantFire, alt) {
    const st = G.weap, w = WEAPONS[G.weaponId], p = G.player;
    const m = this.muzzle(G);
    if (st.vent > 0) { st.beamOn = 0; return; }
    if (wantFire && st.heat >= w.beamMax) { st.vent = w.beamVent; Audio3D_SFX.cannonOverheat(); st.beamOn = 0; return; }
    if (!wantFire) {
      if (st.beamOn > 0) { Audio3D_SFX.cannonBeamStop(); st.beamOn = 0; }
      st.spin = Math.max(0, st.spin - dt * 1.5);
      return;
    }
    st.spin = Math.min(w.spinUp, st.spin + dt);
    if (st.spin < w.spinUp) { Audio3D_SFX.cannonSpin(p.x, 0, 0); return; }
    if (st.beamOn === 0) { Audio3D_SFX.cannonBeamStart(p.x, 0, 0); st.beamOn = 1; }
    st.heat += dt;

    const len = (w.range || 200) * CFG2.PPM;
    const ex = m.x + m.ax * len, ey = m.y + m.ay * len;
    const hit = raySolid(G.L, m.x, m.y, ex, ey, true);
    const ex2 = hit ? hit.x : ex, ey2 = hit ? hit.y : ey;
    G.beam = { x1: m.x, y1: m.y, x2: ex2, y2: ey2 };
    if (hit) FX.burst(ex2, ey2, 2, '#ffb060', 60, 2, 100);

    for (const z of G.enemies) {
      if (z.dead) continue;
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      const t = ((zx - m.x) * m.ax + (zy - m.y) * m.ay);
      if (t < 0 || t > len) continue;
      const px = m.x + m.ax * t, py = m.y + m.ay * t;
      if (dist2(px, py, zx, zy) < (z.w * 0.7 + 6) ** 2) {
        G.hitEnemyDirect(z, w.beamDps * dt, zx, zy, false, 1, m.ax, m.ay, true);
      }
    }
  },
};

/** Взрыв: урон по площади + эффекты. */
function doExplosion(G, x, y, r, dmg, owner, col, noSelf) {
  FX.ring(x, y, r, '#ffb060', 0.4);
  FX.burst(x, y, 22, '#ffd24a', 260, 3, 260);
  FX.burst(x, y, 14, '#ff7a2a', 200, 4, 140);
  FX.smoke(x, y, 10, 'rgba(90,90,100,.6)', true);
  Cam.add(clamp(r / 260, 0.15, 0.9));
  Audio3D_SFX.explosionAt(x, 0, 0);

  /* воронка в разрушаемом мире + цепные детонации бочек */
  const rx = r * 0.85;
  if (DEST && DEST.cells) {
    const cw = DEST.cw, ch = DEST.ch;
    const cx0 = Math.max(1, Math.floor((x - rx) / cw)), cx1 = Math.min(DEST.cols - 2, Math.ceil((x + rx) / cw));
    const cy0 = Math.max(1, Math.floor((y - rx) / ch)), cy1 = Math.min(DEST.rows - 2, Math.ceil((y + rx) / ch));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const m = DEST.mat(cx, cy);
      if (m && MAT2[m] && MAT2[m].boom) G.queueBoom(cx * cw + 4, cy * ch + 4);
    }
    DEST.carve(x, y, rx, 1);
    FX.dust(x, y, 14, 0);
  }

  for (const z of G.enemies) {
    if (z.dead) continue;
    const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
    const d = Math.hypot(zx - x, zy - y);
    if (d > r) continue;
    const f = 1 - d / r;
    G.hitEnemyDirect(z, dmg * (0.45 + 0.55 * f), zx, zy, false, 6 * f, (zx - x) / (d || 1), (zy - y) / (d || 1));
  }
  if (owner !== 'p' || !noSelf) {
    const p = G.player;
    const d = Math.hypot((p.x + p.w / 2) - x, (p.y + p.h / 2) - y);
    if (d < r * 1.1) G.hurtPlayer(dmg * 0.35 * (1 - d / (r * 1.1)), x, y);
  }
}


/* ===== 09-enemies.js ===== */
/* ============================================================
   09 — ВРАГИ: зомби всех типов из таблицы ZOMBIES, ИИ, мини-боссы и боссы
   ============================================================ */

const Enemies = {

  /** Создать зомби данного типа. mods — множители волны. */
  make(G, type, x, y, mods) {
    const d = ZOMBIES[type] || ZOMBIES.walker;
    const s = d.scale || 1;
    const m = mods || {};
    const hpMul = (m.hp || 1) * (G.diffHp || 1);
    const spMul = (m.speed || 1) * (G.diffSpeed || 1);
    const dmMul = (m.dmg || 1) * (G.diffDmg || 1);

    const z = {
      type, def: d, name: d.name,
      w: 14 * s, h: 34 * s,
      x, y: y - 34 * s,
      vx: 0, vy: 0, face: 1, onGround: false,
      hp: d.hp * hpMul, maxHp: d.hp * hpMul,
      speed: d.speed * CFG2.PPM * 0.55 * spMul,
      dmg: d.dmg * dmMul,
      score: d.score, money: d.money,
      anim: Math.random() * 10,
      atkCd: 0, shootCd: rnd(0.5, 2), abilityCd: (d.abilityCd || 6) * rnd(0.6, 1.0),
      hurtT: 0, dead: false, flying: !!d.flying, hover: d.hover || 0,
      armor: (d.armor || 0) + (m.armor || 0),
      slow: 0, burn: 0, burnT: 0,
      charge: 0, chargeCd: 0,
      jumpCd: 0, stuck: 0, elite: false,
      boss: !!d.boss, mini: !!d.miniBoss,
      scale: s,
    };
    if (G.wave >= 12 && !z.boss && Math.random() < 0.14) {
      z.elite = true; z.hp *= 2.2; z.maxHp = z.hp; z.speed *= 1.12; z.dmg *= 1.3;
      z.score = Math.round(z.score * 2); z.money = Math.round(z.money * 2);
      z.armor += 0.15;
    }
    if (d.miniBoss || d.boss) z.elite = false;
    return z;
  },

  /* -------------------------------------------------- ИИ -------------------------------------------------- */
  update(G, z, dt) {
    const p = G.player, L = G.L;
    if (z.hurtT > 0) z.hurtT -= dt;
    if (z.slow > 0) z.slow -= dt;
    if (z.burn > 0) {
      z.burn -= dt * 12;
      z.hp -= dt * 26;
      if (Math.random() < 0.25) FX.spawn(z.x + z.w / 2 + rnd(-5, 5), z.y + rnd(0, z.h), rnd(-20, 20), -rnd(30, 70), 0.35, '#ff9a2a', 2, -60);
      if (z.hp <= 0) return G.killEnemy(z, 'burn');
    }
    if (z.dead) return;

    const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    const px = p.x + p.w / 2, py = p.y + p.h / 2;
    const dx = px - cx, dy = py - cy;
    const distV = Math.hypot(dx, dy);
    const distH = Math.abs(dx);

    /* способности боссов */
    if (z.def.abilities && z.def.abilities.length) {
      z.abilityCd -= dt;
      if (z.abilityCd <= 0 && !p.dead && distV < 420) {
        z.abilityCd = (z.def.abilityCd || 6) * rnd(0.85, 1.2);
        this.ability(G, z, pick(z.def.abilities), dx, dy, distV);
      }
    }
    if (z.def.separation !== undefined) { /* зарезервировано */ }

    const spd = z.speed * (z.slow > 0 ? 0.45 : 1) * (z.charge > 0 ? 3.1 : 1);
    if (z.charge > 0) z.charge -= dt;

    if (z.flying) {
      /* летун: держит высоту над игроком и пикирует */
      const targetY = p.y - z.def.hover * CFG2.PPM * 0.5 + Math.sin(G2.time * 2 + z.anim) * 12;
      z.vy = approach(z.vy, clamp((targetY - z.y) * 3.2, -230, 230), 900 * dt);
      z.vx = approach(z.vx, sign(dx) * spd * 0.9, 620 * dt);
      z.x += z.vx * dt; z.y += z.vy * dt;
      z.anim += dt * 4;
    } else {
      /* наземный: идёт к игроку, прыгает через препятствия и наверх */
      const want = (distH > 5 ? sign(dx) : 0) * spd;
      z.vx = approach(z.vx, want, 900 * dt);
      z.vy = Math.min(z.vy + CFG2.GRAV * dt, CFG2.MAX_FALL);

      z.jumpCd -= dt;
      if (z.onGround && z.jumpCd <= 0) {
        const blocked = (want > 0 && this.solidAt(G, z.x + z.w + 3, z.y + z.h - 6)) ||
          (want < 0 && this.solidAt(G, z.x - 3, z.y + z.h - 6));
        const needUp = dy < -26 && distH < 90;
        const noFloor = !groundAhead(L, z.x + (want > 0 ? z.w : -8), z.y + z.h + 1, 10, 8);
        if (blocked || needUp || (noFloor && distH > 20)) {
          z.vy = -(CFG2.JUMP_V * (z.mini ? 0.86 : 0.95));
          z.jumpCd = rnd(0.35, 0.8);
          z.onGround = false;
        }
      }
      const res = moveBody(z, z.vx * dt, z.vy * dt, L, false);
      if (res.ground) { z.onGround = true; if (z.vy > 0) z.vy = 0; }
      if (res.hitX) { z.vy = -CFG2.JUMP_V * 0.8; z.jumpCd = 0.3; }
      if (res.hitY) z.vy = 0;
      z.anim += dt * (2.4 + Math.abs(z.vx) * 0.02);

      /* --- зомби прогрызает себе путь сквозь блоки --- */
      z.digCd = (z.digCd || 0) - dt;
      if (z.digCd <= 0 && !p.dead) {
        const bx = cx + z.face * (z.w * 0.5 + 5);
        const by = z.y + z.h * 0.5;
        const cxm = Math.floor(bx / DEST.cw), cym = Math.floor(by / DEST.ch);
        const m = DEST.mat(cxm, cym);
        if (m && MAT2[m] && !MAT2[m].hard) {
          const bp = (z.def.breakPower || 1) * (z.boss ? 2.4 : z.mini ? 1.6 : 1);
          const r = 5 + bp * 4.5;
          DEST.carve(bx, by, r, 1);
          const n = Math.round(3 + bp * 2);
          FX.burst(bx, by, n, '#9a8a70', 130, 2, 560);
          FX.debris(bx, by, 2, Math.round(DEST.cw));
          BULLETS.spawn({
            x: bx, y: by, vx: (bx - cx) * 8 + rnd(-40, 40), vy: rnd(-160, -60),
            life: 0.5, dmg: 0, owner: 'z', kind: 'debris', col: '#9a8a70', size: 2, grav: 700, trail: 0,
          });
          z.digCd = clamp(0.5 / bp, 0.12, 0.6);
          if (Math.random() < 0.5) Audio3D_SFX.hit(bx, 0, 0);
        }
      }
    }

    if (Math.abs(z.vx) > 4) z.face = z.vx > 0 ? 1 : -1;
    else if (distH > 4) z.face = dx > 0 ? 1 : -1;

    /* --- антизастревание: зомби не должен навсегда зависнуть за стеной --- */
    if (!z.flying && !z.boss) {
      const moved = Math.abs(cx - (z._lastX === undefined ? cx : z._lastX));
      z._lastX = cx;
      if (moved < 0.5 && Math.abs(dx) > 30) z.stuck += dt; else z.stuck = Math.max(0, z.stuck - dt * 2);
      if (z.stuck > 2.5 && z.stuck < 2.7) {
        /* прыжок в сторону игрока */
        z.vy = -CFG2.JUMP_V * 1.15;
        z.vx = sign(dx) * z.speed * 2.4;
        z.onGround = false;
      }
      if (z.stuck > 7) {
        /* не смог дойти — перебрасываем ближе к игроку */
        const nx = clamp(px + sign(dx) * -rnd(240, 380) + rnd(-40, 40), 30, L.w - 40);
        const ny = Game.findGround(nx);
        z.x = nx - z.w / 2; z.y = (ny > 0 ? ny : z.y) - z.h - 4;
        z.vx = 0; z.vy = 0; z.stuck = 0;
        FX.ring(nx, z.y + z.h / 2, 34, '#c24bff', 0.4);
      }
    }

    /* урон от опасных зон */
    const hz = pointHazard(L, cx, z.y + z.h - 2);
    if (hz) {
      if (hz.kind === 'acid' || hz.kind === 'lava') { z.hp -= dt * 60; if (z.hp <= 0) return G.killEnemy(z, 'hazard'); }
      else if (z.vy > -10 && z.onGround) { z.y = hz.y - z.h - 0.5; z.onGround = false; }
    }
    if (z.y > L.h + 160) { z.y = -80; }
    if (z.x < 0) z.x = 0; else if (z.x > L.w - z.w) z.x = L.w - z.w;

    /* атака вблизи */
    z.atkCd -= dt;
    const reach = (z.def.atkRange || 1.5) * CFG2.PPM;
    if (z.atkCd <= 0 && distH < reach + z.w && Math.abs(dy) < z.h * 0.9 + 14) {
      z.atkCd = z.mini ? 1.0 : 1.15;
      G.hurtPlayer(z.dmg, cx + sign(dx) * 10, cy);
      /* удар зомби крошит землю под ногами цели */
      if (!z.flying) {
        const bp = z.def.breakPower || 1;
        DEST.carve(cx + sign(dx) * 12, cy, 6 + bp * 4, 1);
        FX.debris(cx + sign(dx) * 12, cy, 2, DEST.cw);
      }
      FX.burst(cx + sign(dx) * 12, cy, 5, '#c01824', 120, 2, 400);
      Audio3D_SFX.hit(cx, 0, 0);
      if (z.def.explosive) { G.explode(cx, cy, (z.def.blastR || 6.5) * CFG2.PPM, z.def.blastDmg || 90, 'z'); return G.killEnemy(z, 'boom'); }
    }

    /* стрельба */
    if (z.def.shoot) {
      z.shootCd -= dt;
      if (z.shootCd <= 0 && distH < (z.def.shootRange || 20) * CFG2.PPM && distH > 24 && !p.dead) {
        z.shootCd = (z.def.shootCd || 2.4) * rnd(0.85, 1.2);
        this.shoot(G, z, cx, cy - z.h * 0.2, px, py);
      }
    }
    /* лекрь лечит союзников */
    if (z.def.heals) {
      z.healCd = (z.healCd || 0) - dt;
      if (z.healCd <= 0) {
        z.healCd = z.def.healCd || 3;
        for (const o of G.enemies) {
          if (o === z || o.dead) continue;
          if (Math.hypot(o.x - z.x, o.y - z.y) < (z.def.healRange || 9) * CFG2.PPM &&
            o.hp < o.maxHp) {
            o.hp = Math.min(o.maxHp, o.hp + (z.def.healAmount || 55));
            FX.num(o.x + o.w / 2, o.y - 6, z.def.healAmount || 55, '#6de06d');
          }
        }
      }
    }
    /* призыватель */
    if (z.def.summons) {
      z.sumCd = (z.sumCd || 0) - dt;
      if (z.sumCd <= 0) {
        z.sumCd = z.def.summonCd || 6.5;
        for (let i = 0; i < (z.def.summonCount || 4); i++) {
          G.spawnZombie(pick(['walker', 'crawler', 'runner']), cx + rnd(-90, 90), cy - 30);
        }
        FX.ring(cx, cy, 60, '#c24bff', 0.5);
      }
    }
  },

  solidAt(G, x, y) {
    return DEST.solidPx(x, y);
  },

  shoot(G, z, x, y, tx, ty) {
    const d = z.def;
    const sp = (d.shootSpeed || 24) * CFG2.PPM * 0.55;
    const dy = d.shootGrav ? d.shootGrav * CFG2.PPM : 0;
    let a = Math.atan2(ty - y, tx - x);
    if (d.shootGrav) a -= 0.16;   // компенсация гравитации
    const col = { spit: '#a8d84a', plasma: '#7fd8ff', frost: '#a8e8ff' }[d.shoot] || '#ff9a6a';
    const n = d.abilities && d.abilities.indexOf('barrage') >= 0 ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const aa = a + (i - (n - 1) / 2) * 0.13;
      BULLETS.spawn({
        x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, life: 4.2,
        dmg: (d.shootDmg || 15) * (G.diffDmg || 1), owner: 'z', kind: d.shoot,
        col, size: 3, grav: dy, trail: 6, hitR: 0,
      });
    }
    Audio3D_SFX.shot(d.shoot === 'plasma' ? 'laser' : 'pistol', x, 0, 0);
  },

  ability(G, z, kind, dx, dy, dist) {
    const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    const p = G.player;
    FX.label(cx, z.y - 12, kind === 'charge' ? 'РЫВОК!' : kind === 'shockwave' ? 'УДАР!' :
      kind === 'summon' ? 'ПРИЗЫВ!' : kind === 'barrage' ? 'ЗАЛП!' : kind === 'frost' ? 'МОРОЗ!' :
        kind === 'devour' ? 'ПОЖИРАНИЕ!' : 'МИНИ-БОССЫ!', z.def.aura ? hex(z.def.aura) : '#ff8a4a', 1.0);
    switch (kind) {
      case 'charge':
        z.charge = 0.55; Audio3D_SFX.growl(cx, 0, 0); break;
      case 'shockwave':
        G.explode(cx, cy, 110, z.dmg * 1.6, 'z', null, true);
        FX.ring(cx, cy, 130, '#ffb060', 0.5); Cam.add(0.5); break;
      case 'summon':
        for (let i = 0; i < 3; i++) G.spawnZombie(pick(['walker', 'crawler', 'runner']), cx + rnd(-70, 70), cy - 20);
        FX.ring(cx, cy, 70, '#c24bff', 0.5); break;
      case 'summonMinions':
        for (let i = 0; i < 2; i++) G.spawnZombie(pick(['stalker', 'spider', 'cryomancer']), cx + rnd(-120, 120), cy - 30);
        FX.ring(cx, cy, 140, '#9a3aff', 0.7); Cam.add(0.7); break;
      case 'barrage':
        for (let i = 0; i < 5; i++) {
          const a = Math.atan2(dy, dx) + (i - 2) * 0.18;
          BULLETS.spawn({
            x: cx, y: cy - z.h * 0.2, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330,
            life: 3.0, dmg: z.dmg * 0.5, owner: 'z', kind: 'bolt',
            col: '#ff7a4a', size: 3, grav: 40, trail: 7, hitR: 0,
          });
        }
        break;
      case 'frost':
        for (let i = 0; i < 3; i++) {
          const a = Math.atan2(dy, dx) + (i - 1) * 0.14;
          BULLETS.spawn({
            x: cx, y: cy - z.h * 0.2, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,
            life: 3.0, dmg: z.dmg * 0.4, owner: 'z', kind: 'frost', col: '#a8e8ff',
            size: 3, grav: 0, trail: 8, hitR: 0, frost: true,
          });
        }
        break;
      case 'devour':
        z.hp = Math.min(z.maxHp, z.hp + z.maxHp * 0.08);
        FX.num(cx, z.y - 8, z.maxHp * 0.08, '#6de06d');
        FX.ring(cx, cy, 80, '#ff2a3a', 0.5); break;
    }
  },

  /* -------------------------------------------------- отрисовка -------------------------------------------------- */
  draw(G, ctx, z) {
    if (z.flying) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      circle(ctx, z.x + z.w / 2, z.y + z.h + 6, 7, '#000');
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = 0.28;
      rect(ctx, z.x + 1, z.y + z.h - 2, z.w - 2, 3, '#000');
      ctx.restore();
    }
    if (z.hurtT > 0) { ctx.save(); ctx.globalAlpha = 0.85; }
    drawZombie(ctx, z);
    if (z.hurtT > 0) ctx.restore();

    /* горящий */
    if (z.burn > 0) {
      for (let i = 0; i < 3; i++)
        FX.spawn(z.x + rnd(0, z.w), z.y + rnd(0, z.h), rnd(-15, 15), -rnd(20, 60), 0.25, pick(['#ff9a2a', '#ffd24a']), 2, -40);
    }
  },

  /** Полоска ХП (только для раненых, мини-боссов и боссов). */
  drawBar(ctx, z) {
    if (z.hp >= z.maxHp && !z.mini && !z.boss) return;
    const w = z.boss ? 62 : z.mini ? 44 : 20;
    const x = z.x + z.w / 2 - w / 2, y = z.y - (z.mini || z.boss ? 12 : 7);
    const col = z.boss ? '#ff3a5a' : z.mini ? '#ff9a2a' : '#6de06d';
    drawHpBar(ctx, x, y, w, z.hp, z.maxHp, col);
    if (z.armor > 0.05) {
      rect(ctx, x, y + 4, w, 2, 'rgba(120,170,255,.65)');
    }
  },
};


/* ===== 10-ui.js ===== */
/* ============================================================
   10 — ИНТЕРФЕЙС (весь в пиксельном стиле)
   HUD, магазин, пауза, главное меню, конец игры, кнопки телефона
   ============================================================ */

const UI = {
  hot: [],          // кликабельные прямоугольники текущего кадра
  shopCat: 'pistol',
  shopOpen: false,
  menuTab: 0,
  toastT: 0, toastS: '',
  banner: null,
  hitMarker: 0,
  mouseOverUI: false,
  lastShopMsg: '',

  CATS: [
    { id: 'melee',   name: 'БЛИЖНИЙ БОЙ' },
    { id: 'pistol',  name: 'ПИСТОЛЕТЫ' },
    { id: 'smg',     name: 'ПП' },
    { id: 'shotgun', name: 'ДРОБОВИКИ' },
    { id: 'rifle',   name: 'ВИНТОВКИ' },
    { id: 'sniper',  name: 'СНАЙПЕРКИ' },
    { id: 'lmg',     name: 'ПУЛЕМЁТЫ' },
    { id: 'heavy',   name: 'ТЯЖЁЛОЕ' },
    { id: 'banana',  name: 'БАНАНЫ' },
    { id: 'exp',     name: 'ЭКСПЕРИМЕНТ' },
    { id: 'drill',   name: 'ИНСТРУМЕНТ' },
    { id: 'gear',    name: 'СНАРЯЖЕНИЕ' },
  ],

  clear() { this.hot.length = 0; },
  banana(ctx, x, y) {
    const g = '#f2c53d', d = '#c99b1e';
    rect(ctx, x - 10, y + 2, 26, 7, g);
    rect(ctx, x - 12, y + 4, 30, 3, g);
    rect(ctx, x - 10, y + 7, 26, 2, d);
    rect(ctx, x - 12, y + 3, 3, 5, '#6b5010');
    rect(ctx, x + 14, y + 1, 3, 5, '#6b5010');
    rect(ctx, x - 4, y + 1, 12, 2, '#ffe98a');
  },
  add(id, x, y, w, h, data) {
    this.hot.push({ id, x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h), data });
  },
  hit(x, y) {
    for (let i = this.hot.length - 1; i >= 0; i--) {
      const r = this.hot[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
    }
    return null;
  },
  toast(s) { this.toastS = s; this.toastT = 1.6; },

  /* ================================================================ HUD */
  hud(ctx, G) {
    const p = G.player;
    const W = G2.vw, H = G2.vh;
    const lowHp = p.hp < p.maxHp * 0.3;
    const pulse = lowHp ? (0.5 + 0.5 * Math.sin(G2.time * 9)) : 0;

    /* --- здоровье и броня слева снизу --- */
    const bw = 138;
    panel(ctx, 6, H - 60, bw + 42, 54, 'rgba(8,11,18,.9)', '#05070b', '#4a5670');
    text(ctx, 'HP', 14, H - 44, 12, lowHp ? '#ff5a4a' : '#e8eefa', 'left', true);
    pixBar(ctx, 36, H - 50, bw, 11, p.hp / p.maxHp,
      lowHp ? (pulse > 0.5 ? '#ff8a7a' : '#e04a3a') : (p.hp > p.maxHp * 0.6 ? '#5ad86a' : '#e8c23a'), '#1a0d10');
    text(ctx, Math.max(0, Math.ceil(p.hp)) + '/' + p.maxHp, 36 + bw + 4, H - 42, 10, '#e8eefa');
    text(ctx, 'БРОНЯ', 14, H - 24, 10, '#9fb0d0');
    pixBar(ctx, 62, H - 30, bw - 28, 7, p.armor / 100, '#5aa8ff', '#0d1520');
    text(ctx, Math.ceil(p.armor), 36 + bw + 4, H - 24, 10, '#9fc0ff');

    /* --- патроны, деньги, оружие справа снизу --- */
    const wp = WEAPONS[G.weaponId];
    const mag = Weap.ammo(G.weap, G.weaponId);
    const res = wp.mag === Infinity ? '' : (G.weap.reserve[G.weaponId] || 0);
    const pw = 168;
    panel(ctx, W - pw - 8, H - 60, pw, 54, 'rgba(8,11,18,.9)', '#05070b', '#4a5670');
    text(ctx, wp.name, W - 16, H - 44, 12, '#ffd94a', 'right', true);
    const ammoStr = mag === Infinity ? '∞' : (mag + ' / ' + res);
    text(ctx, ammoStr, W - 16, H - 22, 15, mag === 0 ? '#ff5a4a' : '#ffffff', 'right', true);
    if (G.weap.reloadT > 0) {
      const wf = 1 - G.weap.reloadT / Weap.reloadTime(G.weaponId);
      pixBar(ctx, W - pw - 2, H - 16, pw - 10, 5, wf, '#ffd94a', '#1a1408');
    }
    text(ctx, '₽ ' + Math.round(G.player.money), W - 16, H - 4, 11, '#6de06d', 'right', true);

    /* --- волна сверху слева --- */
    panel(ctx, 6, 6, 168, 40, 'rgba(8,11,18,.9)', '#05070b', '#4a5670');
    text(ctx, 'ВОЛНА ' + G.wave, 14, 24, 13, '#ffd94a', 'left', true);
    const alive = G.enemies.length;
    text(ctx, 'врагов ' + alive + '   очки ' + G.score, 14, 40, 10, '#c8d4e8');
    if (G.waveState === 'inter') {
      pixBar(ctx, 6, 48, 168, 5, 1 - G.interT / G.interMax, '#5aa8ff', '#0d1520');
    }

    /* --- карта и подсказка сверху по центру --- */
    text(ctx, G.L.name, W / 2, 20, 12, '#ffffff', 'center', true);
    if (G.hint) text(ctx, G.hint, W / 2, 36, 10, '#b8c6dc', 'center');

    /* --- кнопка магазина --- */
    if (G.waveState === 'inter' || G.mode === 'range') {
      const bx = W / 2 - 52, by = 48;
      const hov = G2.mouse.x > bx && G2.mouse.x < bx + 104 && G2.mouse.y > by && G2.mouse.y < by + 26;
      pixBtn(ctx, bx, by, 104, 26, 'МАГАЗИН  B', hov ? 'hot' : '', 12);
      this.add('shop', bx, by, 104, 26);
    }

    /* --- список убийств / всплывающие сообщения --- */
    for (let i = 0; i < G.feed.length; i++) {
      const f = G.feed[i];
      const a = clamp(f.t / 1.2, 0, 1);
      ctx.globalAlpha = a;
      text(ctx, f.s, W - 12, 62 + i * 15, 10, f.c || '#c8d4e8', 'right');
      ctx.globalAlpha = 1;
    }

    /* --- индикатор перезарядки и предупреждения --- */
    if (ammoStr === '0 / 0') text(ctx, 'НЕТ ПАТРОНОВ — СМЕНИ СТВОЛ', W / 2, H - 68, 13, '#ff5a4a', 'center', true);
    if (p.frozen > 0) text(ctx, 'ЗАМОРОЖЕН', W / 2, H - 86, 12, '#a8e8ff', 'center', true);

    /* --- прицел --- */
    this.reticle(ctx, G);

    /* --- цель --- */
    if (this.hitMarker > 0) {
      this.hitMarker -= G2.dt;
      ctx.globalAlpha = clamp(this.hitMarker * 5, 0, 1);
      const cx = G2.isMobile && Ctrl.useStick && Ctrl.aimStick ? Ctrl.aimStick.ox : G2.mouse.x;
      const cy = G2.isMobile && Ctrl.useStick && Ctrl.aimStick ? Ctrl.aimStick.oy : G2.mouse.y;
      line(ctx, cx - 6, cy - 6, cx - 2, cy - 2, 2, '#ff6a5a');
      line(ctx, cx + 6, cy - 6, cx + 2, cy - 2, 2, '#ff6a5a');
      line(ctx, cx - 6, cy + 6, cx - 2, cy + 2, 2, '#ff6a5a');
      line(ctx, cx + 6, cy + 6, cx + 2, cy + 2, 2, '#ff6a5a');
      ctx.globalAlpha = 1;
    }

    /* --- здоровье босса --- */
    const boss = G.enemies.find(e => e.boss && !e.dead);
    if (boss) {
      const w2 = Math.min(360, W - 60);
      const x2 = W / 2 - w2 / 2;
      panel(ctx, x2 - 4, H - 96, w2 + 8, 22, 'rgba(10,14,21,.86)', '#05070b', '#7a2030');
      text(ctx, boss.name, W / 2, H - 84, 10, '#ff8a8a', 'center', true);
      pixBar(ctx, x2, H - 80, w2, 6, boss.hp / boss.maxHp, '#ff3a5a', '#2a0d14');
    }

    /* --- баннер волны --- */
    if (this.banner) {
      this.banner.t -= G2.dt;
      if (this.banner.t <= 0) this.banner = null;
      else {
        const a = clamp(this.banner.t / 0.5, 0, 1) * clamp((this.banner.max - this.banner.t) / 0.25, 0, 1);
        ctx.globalAlpha = a;
        const bw2 = 320, bx2 = W / 2 - bw2 / 2;
        panel(ctx, bx2, H / 2 - 46, bw2, 56, 'rgba(8,11,18,.94)', '#05070b', '#ffd94a');
        text(ctx, this.banner.title, W / 2, H / 2 - 22, 20, '#ffd94a', 'center', true);
        text(ctx, this.banner.sub || '', W / 2, H / 2 + 0, 12, '#e8eefa', 'center');
        ctx.globalAlpha = 1;
      }
    }

    /* --- сообщение --- */
    if (this.toastT > 0) {
      this.toastT -= G2.dt;
      ctx.globalAlpha = clamp(this.toastT / 0.5, 0, 1);
      text(ctx, this.toastS, W / 2, H / 2 + 60, 12, '#ffd94a', 'center', true);
      ctx.globalAlpha = 1;
    }
  },

  reticle(ctx, G) {
    let cx, cy;
    if (G2.isMobile) {
      if (Ctrl.useStick && Ctrl.aimStick) { cx = Ctrl.aimStick.ox; cy = Ctrl.aimStick.oy; }
      else { cx = G2.vw / 2; cy = G2.vh / 2; }
    } else { cx = G2.mouse.x; cy = G2.mouse.y; }
    const sp = G.recoil * 12;
    const col = G.reloading ? '#ffd94a' : '#eaf2ff';
    const g = 4 + sp;
    rect(ctx, cx - 1, cy - 1, 2, 2, col);
    rect(ctx, cx - g - 7, cy - 1, 7, 2, col);
    rect(ctx, cx + g, cy - 1, 7, 2, col);
    rect(ctx, cx - 1, cy - g - 7, 2, 7, col);
    rect(ctx, cx - 1, cy + g, 2, 7, col);
  },

  /* ================================================================ КНОПКИ ТЕЛЕФОНА */
  touch(ctx, G) {
    if (!G2.isMobile) return;
    for (const d of BTN_DEF) {
      const b = btnPos(d);
      const st = G2.btn[d.id] ? 'down' : '';
      pixCircleBtn(ctx, b.x, b.y, b.r, d.label, st, d.id === 'fire' ? 13 : 8);
    }
    if (G2.sticks.move) drawStick(ctx, G2.sticks.move, 56, '#6fd0ff');
    if (G2.sticks.aim) drawStick(ctx, G2.sticks.aim, 50, '#ffb04a');
  },

  /* ================================================================ МАГАЗИН */
  shop(ctx, G) {
    const W = G2.vw, H = G2.vh;
    ctx.fillStyle = 'rgba(4,6,10,.86)';
    ctx.fillRect(0, 0, W, H);

    panel(ctx, 8, 8, W - 16, H - 16, 'rgba(14,19,29,.98)', '#05070b', '#5a6a8c');
    text(ctx, 'МАГАЗИН', 22, 32, 18, '#ffd94a', 'left', true);
    text(ctx, '₽ ' + Math.round(G.player.money), W - 22, 32, 15, '#6de06d', 'right', true);

    /* категории слева */
    const cx0 = 18, cy0 = 46, cw = 132, chh = 22;
    for (let i = 0; i < this.CATS.length; i++) {
      const c = this.CATS[i];
      const y = cy0 + i * (chh + 3);
      if (y + chh > H - 52) break;
      const on = this.shopCat === c.id;
      pixBtn(ctx, cx0, y, cw, chh, c.name, on ? 'down' : '', 10);
      this.add('cat', cx0, y, cw, chh, c.id);
    }

    /* список предметов */
    const lx = cx0 + cw + 12;
    const lw = W - lx - 20;
    const items = [];
    if (this.shopCat === 'gear') {
      for (const gid in GEAR) items.push({ id: gid, gear: true, w: GEAR[gid] });
    } else {
      for (const id in WEAPONS) {
        const w = WEAPONS[id];
        if (w.cat !== this.shopCat) continue;
        items.push({ id, w });
      }
    }
    const rowH = 30;
    const maxRows = Math.floor((H - cy0 - 62) / rowH);
    const start = clamp(this.shopScroll || 0, 0, Math.max(0, items.length - maxRows));
    for (let i = 0; i < maxRows; i++) {
      const it = items[start + i];
      if (!it) break;
      const y = cy0 + i * rowH;
      const w = it.w;
      const price = it.gear ? w.price : w.price;
      const owned = G.owned[it.id];
      const afford = G.player.money >= price;
      const hover = G2.mouse.x > lx && G2.mouse.x < lx + lw && G2.mouse.y > y && G2.mouse.y < y + rowH - 3;
      panel(ctx, lx, y, lw, rowH - 3,
        hover ? '#2a3448' : '#181f2c', '#0a0e15', owned ? '#2e6b3a' : '#39445c');
      if (!it.gear) {
        rect(ctx, lx + 2, y + 2, 52, rowH - 7, 'rgba(0,0,0,.24)');
        ctx.save();
        ctx.translate(lx + 6, y + rowH / 2 - 3);
        drawGunShape(ctx, w.cat, 44, it.id, true);
        ctx.restore();
      }
      text(ctx, it.gear ? w.name : w.name, lx + 60, y + 14, 11, owned ? '#8fd8a0' : '#ffffff', 'left', true);
      if (!it.gear) {
        const mag = w.mag === Infinity ? '∞' : w.mag;
        text(ctx, 'УРОН ' + (w.dmg || 0) + '  ТЕМП ' + w.rpm + '  МАГ ' + mag, lx + 60, y + 25, 9, '#9fb0c8');
      } else {
        text(ctx, 'БРОНЯ ' + w.ap + (w.helmet ? ' + ШЛЕМ' : ''), lx + 60, y + 25, 9, '#9fb0c8');
      }
      text(ctx, owned ? 'КУПЛЕНО' : '₽' + price, lx + lw - 8, y + 17, 11,
        owned ? '#6de06d' : (afford ? '#ffd94a' : '#c07a7a'), 'right', true);
      this.add('buy', lx, y, lw, rowH - 3, it);
    }
    this.shopScroll = start;
    text(ctx, 'колесо/▲▼ — прокрутка · ' + (items.length) + ' позиций', lx, H - 56, 8, '#5f6a82');

    /* кнопка «ГОТОВ» */
    const gw = 150, gx = W / 2 - gw / 2, gy = H - 44;
    pixBtn(ctx, gx, gy, gw, 30, 'В БОЙ  (ENTER)', '', 13);
    this.add('ready', gx, gy, gw, 30);
    this._shopItems = items;
    this._shopStart = start;
    this._shopMax = maxRows;
  },

  /* ================================================================ ПАУЗА */
  pause(ctx, G) {
    const W = G2.vw, H = G2.vh;
    ctx.fillStyle = 'rgba(4,6,10,.78)';
    ctx.fillRect(0, 0, W, H);
    const pw = 260, px = W / 2 - pw / 2, py = 40;
    panel(ctx, px, py, pw, H - 80, 'rgba(14,19,29,.98)', '#05070b', '#5a6a8c');
    text(ctx, 'ПАУЗА', W / 2, py + 26, 18, '#ffd94a', 'center', true);

    const items = [
      ['resume', 'ПРОДОЛЖИТЬ'],
      ['shop', 'МАГАЗИН' + (G.waveState === 'inter' ? '' : ' (между волнами)')],
      ['restart', 'НАЧАТЬ ЗАНОВО'],
      ['menu', 'ГЛАВНОЕ МЕНЮ'],
      ['sfx', 'ЗВУК: ' + (Math.round(Store2.load().settings.sfx * 100)) + '%'],
      ['aim', 'АВТОПРИЦЕЛ: ' + (G2.autoAim ? 'ВКЛ' : 'ВЫКЛ')],
      ['gore', 'КРОВЬ: ' + (Store2.load().settings.gore ? 'ВКЛ' : 'ВЫКЛ')],
      ['shake', 'ТРЯСКА: ' + (Store2.load().settings.screenShake ? 'ВКЛ' : 'ВЫКЛ')],
    ];
    let y = py + 46;
    for (const [id, label] of items) {
      const dis = (id === 'shop' && G.waveState !== 'inter' && G.mode !== 'range');
      pixBtn(ctx, px + 16, y, pw - 32, 26, label, dis ? 'off' : '', 11);
      if (!dis) this.add(id, px + 16, y, pw - 32, 26);
      y += 30;
    }
    text(ctx, 'WASD — ходьба · ПРОБЕЛ — прыжок · ЛКМ — огонь', W / 2, H - 20, 9, '#7f8ca3', 'center');
  },

  /* ================================================================ ГЛАВНОЕ МЕНЮ */
  menu(ctx, G) {
    const W = G2.vw, H = G2.vh;
    ctx.fillStyle = '#080b12';
    ctx.fillRect(0, 0, W, H);
    /* фон-полоски */
    for (let i = 0; i < 14; i++) rect(ctx, 0, i * (H / 14), W, Math.ceil(H / 14) + 1, mixCol(0x131a2a, 0x0a0e18, i / 13));

    this.banana(ctx, W / 2 - 8, 14);

    text(ctx, 'BANANA SHOOTER', W / 2, 46, 19, '#ffd94a', 'center', true);
    text(ctx, '2D · САЙД-СКРОЛЛЕР · ОФЛАЙН', W / 2, 60, 9, '#8fd8ff', 'center', true);

    /* выбор карты */
    const cw = 118, chh = 52, cols = Math.max(3, Math.min(5, Math.floor((W - 20) / (cw + 6))));
    const rows = Math.ceil(MAPS2.length / cols);
    const gx0 = Math.round(W / 2 - (cols * (cw + 6) - 6) / 2);
    const gy0 = 70;
    for (let i = 0; i < MAPS2.length; i++) {
      const c = i % cols, r = (i / cols) | 0;
      const x = gx0 + c * (cw + 6), y = gy0 + r * (chh + 5);
      const sel = G.mapIdx === i;
      const hov = G2.mouse.x > x && G2.mouse.x < x + cw && G2.mouse.y > y && G2.mouse.y < y + chh;
      panel(ctx, x, y, cw, chh, sel ? '#2a3a56' : (hov ? '#1c2434' : '#161d2b'), '#05070b', sel ? '#ffd94a' : '#39445c');
      text(ctx, MAPS2[i].name, x + cw / 2, y + 15, 9, sel ? '#ffd94a' : '#dce4f2', 'center', true);
      const words = MAPS2[i].desc.split(' ');
      let ln = '', ly = y + 28;
      for (const word of words) {
        if (ly > y + chh - 4) break;
        if ((ln + ' ' + word).length > 18) { text(ctx, ln, x + cw / 2, ly, 8, '#7f8ca3', 'center'); ly += 10; ln = word; }
        else ln = ln ? ln + ' ' + word : word;
      }
      if (ly <= y + chh - 4) text(ctx, ln, x + cw / 2, ly, 8, '#7f8ca3', 'center');
      this.add('map', x, y, cw, chh, i);
    }

    const by = gy0 + rows * (chh + 5) + 8;
    const bw = 154;
    const hovS = G2.mouse.x > W / 2 - bw - 6 && G2.mouse.x < W / 2 - 6 && G2.mouse.y > by && G2.mouse.y < by + 28;
    const hovR = G2.mouse.x > W / 2 + 6 && G2.mouse.x < W / 2 + 6 + bw && G2.mouse.y > by && G2.mouse.y < by + 28;
    pixBtn(ctx, W / 2 - bw - 6, by, bw, 28, 'ВЫЖИВАНИЕ', hovS ? 'hot' : '', 13);
    this.add('start_surv', W / 2 - bw - 6, by, bw, 28);
    pixBtn(ctx, W / 2 + 6, by, bw, 28, 'ПОЛИГОН', hovR ? 'hot' : '', 13);
    this.add('start_range', W / 2 + 6, by, bw, 28);

    const st = Store2.load();
    text(ctx, 'рекорд: волна ' + st.bestWave + ' · очки ' + st.bestScore + ' · убито ' + st.kills,
      W / 2, by + 44, 9, '#9fb0c8', 'center', true);
    text(ctx, 'между волнами открывается магазин (B) · 40+ стволов · 10 карт',
      W / 2, by + 58, 8, '#5f6a82', 'center');
  },

  /* ================================================================ КОНЕЦ ИГРЫ */
  over(ctx, G) {
    const W = G2.vw, H = G2.vh;
    ctx.fillStyle = 'rgba(20,4,8,.82)';
    ctx.fillRect(0, 0, W, H);
    const pw = 280, px = W / 2 - pw / 2;
    panel(ctx, px, 48, pw, H - 96, 'rgba(18,14,20,.98)', '#0a0508', '#8c3a4a');
    text(ctx, 'КОНЕЦ', W / 2, 82, 22, '#ff5a5a', 'center', true);
    text(ctx, 'дошёл до волны ' + G.wave, W / 2, 106, 12, '#e8eefa', 'center', true);
    text(ctx, 'очки: ' + G.score, W / 2, 126, 11, '#ffd94a', 'center');
    text(ctx, 'убито: ' + G.kills + '   голов: ' + G.stats.heads, W / 2, 142, 9, '#9fb0c8', 'center');
    const st = Store2.load();
    text(ctx, 'рекорд: волна ' + st.bestWave + ' / ' + st.bestScore + ' очков', W / 2, 158, 9, '#7f8ca3', 'center');
    let y = 180;
    pixBtn(ctx, px + 20, y, pw - 40, 28, 'ЕЩЁ РАЗ', '', 12); this.add('restart', px + 20, y, pw - 40, 28); y += 34;
    pixBtn(ctx, px + 20, y, pw - 40, 28, 'ГЛАВНОЕ МЕНЮ', '', 12); this.add('menu', px + 20, y, pw - 40, 28);
  },
};


/* ===== 11-game.js ===== */
/* ============================================================
   11 — ИГРА: цикл, волны, экономика, урон, режимы, меню
   ============================================================ */

const Game = {
  state: 'menu',          // menu | play | shop | pause | over
  L: null, mapIdx: 0,
  mode: 'survival',
  enemies: [], bullets2: null,
  wave: 0, waveState: 'inter', interT: 0, interMax: 16,
  score: 0, kills: 0, feed: [], hint: '',
  weaponId: 'glock', slots: { 1: 'glock', 2: null, 3: 'knife' }, slotSel: 1,
  owned: { glock: true, knife: true },
  weap: null, acids: [], coins: [], booms: [],
  recoil: 0, reloading: false, beam: null,
  diffHp: 1, diffSpeed: 1, diffDmg: 1,
  ctrl: Ctrl, stats: null,

  /* ================================================================ init */
  init() {
    coreInit();
    const st = Store2.load();
    G2.autoAim = st.settings.autoAim !== false;

    this.player = {
      x: 100, y: 100, w: CFG2.PLAYER_W, h: CFG2.PLAYER_H, vx: 0, vy: 0,
      face: 1, onGround: false, aimX: 1, aimY: 0, walk: 0,
      hp: 100, maxHp: 100, armor: 0, money: 800, dead: false,
      shieldOn: 0, frozen: 0, invuln: 0, hurtFlash: 0,
    };
    this.stats = { shots: 0, hits: 0, heads: 0, bananas: 0 };
    this.weap = Weap.makeState();
    this.L = MAPS2[0];

    const bb = document.getElementById('bootbtn');
    const start = () => {
      document.getElementById('boot').classList.add('hide');
      if (typeof Audio3D_SFX !== 'undefined') {
        Audio3D_SFX.init(); Audio3D_SFX.resume();
        Audio3D_SFX.setVol(st.settings.sfx); Audio3D_SFX.setMusicVol(st.settings.music);
      }
      this.guardAudio();
      requestAnimationFrame(t => this.frame(t));
    };
    bb.addEventListener('click', start);
    if (/[?&]auto/.test(location.search)) {
      setTimeout(() => {
        start();
        if (/[?&]play/.test(location.search)) {
          this.startRun(0, 'survival');
          if (/[?&]turbo/.test(location.search)) this.turboTest();
        }
      }, 60);
    }
  },

  /** Синхронный прогон игры для автотестов: N секунд за один вызов. */
  turboTest(seconds) {
    const msec = (location.search.match(/[?&]sec=(\d+)/) || [])[1];
    if (msec) seconds = parseInt(msec, 10);
    const dt = 1 / 60;
    const steps = Math.round((seconds || 60) / dt);
    let n = 0;
    const t0 = performance.now();
    this.owned.yhs = true; Weap.fill(this.weap, 'yhs');
    this.slots[2] = 'yhs'; this.weaponId = 'yhs'; this.slotSel = 2;
    const gun = (location.search.match(/[?&]gun=(\w+)/) || [])[1];
    if (gun && WEAPONS[gun]) {
      this.owned[gun] = true; Weap.fill(this.weap, gun);
      this.slots[WEAPONS[gun].slot || 2] = gun; this.weaponId = gun; this.slotSel = WEAPONS[gun].slot || 2;
    }
    this.player.money = 999999;
    this.demo = true;
    try {
      for (n = 0; n < steps; n++) {
        G2.dt = dt; G2.time += dt;
        Ctrl.moveX = Math.sin(n * 0.013);
        Ctrl.run = Math.abs(Ctrl.moveX) > 0.7;
        Ctrl.fire = true;
        Ctrl.crouch = false;
        Ctrl.jumpDown = (n % 140) === 0;
        Ctrl.jumpHeld = false;
        Ctrl.useStick = false;
        this.player.invuln = 1e9;           // в тесте не умираем, чтобы дойти до боссов
        if (this.state === 'over') { this.startRun(0, 'survival'); this.player.invuln = 1e9; }
        if (this.state === 'shop') this.closeShop();
        this.update(dt);
        this.draw();
      }
    } catch (e) {
      __logErr('turbo@step' + n + ': ' + (e && e.message) + ' | ' + String((e && e.stack) || '').split('\n')[1]);
    }
    const ms = performance.now() - t0;
    const el = document.createElement('pre');
    el.id = '__turbo';
    el.textContent = 'steps=' + steps + ' done=' + n + ' ms=' + Math.round(ms) +
      ' msPerStep=' + (ms / Math.max(1, n)).toFixed(3) +
      ' wave=' + this.wave + ' kills=' + this.kills + ' enemies=' + this.enemies.length +
      ' parts=' + FX.parts.length + ' state=' + this.state + ' playerHp=' + Math.round(this.player.hp);
    document.body.appendChild(el);
  },

  frame(t) {
    const now = t / 1000;
    let dt = this._last ? now - this._last : 0.016;
    this._last = now;
    dt = Math.min(dt, 0.05);
    G2.dt = dt; G2.time = now;
    G2._fpsAcc += dt; G2._fpsN++;
    if (G2._fpsAcc > 0.4) { G2.fps = G2._fpsN / G2._fpsAcc; G2._fpsAcc = 0; G2._fpsN = 0; }

    try {
      Ctrl.update();
      this.update(dt);
      this.draw();
      corePresent();
    } catch (e) {
      __logErr('frame: ' + (e && e.message ? e.message : e) + ' | ' + ((e && e.stack) ? String(e.stack).split('\n')[1] : ''));
      try { this.draw(); corePresent(); } catch (e2) { }
    }
    G2.frames++;
    requestAnimationFrame(t2 => this.frame(t2));
  },

  /* ================================================================ запуск забега */
  startRun(mapIdx, mode) {
    this.mapIdx = mapIdx; this.mode = mode || 'survival';
    this.L = MAPS2[mapIdx];
    DEST.attach(this.L);
    Cam.x = 200; Cam.y = this.L.h - 200;
    FX.clear(); BULLETS.clear();
    this.enemies.length = 0; this.acids.length = 0; this.coins.length = 0; this.booms.length = 0;
    this.feed.length = 0;
    this.wave = 0; this.score = 0; this.kills = 0;
    this.waveState = 'inter'; this.interT = 6; this.interMax = 6;
    if (/[?&]fast/.test(location.search)) { this.interT = 0.3; this.interMax = 0.3; }
    this.owned = { glock: true, knife: true };
    this.slots = { 1: 'glock', 2: null, 3: 'knife' };
    this.slotSel = 1; this.weaponId = 'glock';
    this.weap = Weap.makeState();
    for (const id in this.owned) Weap.fill(this.weap, id);
    this.stats = { shots: 0, hits: 0, heads: 0, bananas: 0 };
    this.beam = null; this.recoil = 0;
    this.diffHp = 1; this.diffSpeed = 1; this.diffDmg = 1;

    const p = this.player;
    p.hp = 100; p.maxHp = 100; p.armor = 0; p.money = mode === 'range' ? 999999 : 800;
    p.dead = false; p.vx = 0; p.vy = 0; p.shieldOn = 0; p.frozen = 0; p.invuln = 1.2;
    const sp = this.L.spawnPts[0] || { x: 120, y: 100 };
    p.x = sp.x; p.y = sp.y - 40;
    Cam.x = p.x; Cam.y = p.y;

    if (mode === 'range') {
      this.waveState = 'run';
      for (let i = 0; i < 6; i++) this.spawnDummy(320 + i * 90, this.L.h - 200);
      this.hint = 'ПОЛИГОН: всё оружие бесплатно (B), манекены не умирают';
    } else {
      this.hint = 'WASD — движение · ЛКМ — огонь · ПРОБЕЛ — прыжок · B — магазин';
    }
    this.state = 'play';
    UI.banner = { title: mode === 'range' ? 'ПОЛИГОН' : 'ВЫЖИВАНИЕ', sub: this.L.name, t: 1.6, max: 1.6 };
    if (/[?&]demo/.test(location.search)) {
      this.demo = true;
      this.wave = 4; this.diffHp = 1.4;
      this.waveState = 'run'; this._spawnLeft = 0; this._spawnPool = ['walker'];
      this.player.money = 40000;
      const types = ['walker', 'runner', 'crawler', 'spitter', 'tank', 'flyer', 'splitter', 'walker', 'runner', 'tank'];
      for (let i = 0; i < 10; i++) {
        const t = types[i] === 'flyer' ? 'flying' : types[i];
        const z = this.spawnZombie(t, this.player.x + 150 + i * 46, this.player.y - 20);
        z.x = clamp(z.x, 40, this.L.w - 60);
      }
      /* выдаём игроку весь арсенал, чтобы проверить все виды стволов */
      for (const id in WEAPONS) { this.owned[id] = true; Weap.fill(this.weap, id); }
      this.slots[2] = 'ak47'; this.slotSel = 2; this.weaponId = 'ak47';
      if (/[?&]shop/.test(location.search)) setTimeout(() => { this.waveState = 'inter'; this.interT = 99; this.openShop(); }, 400);
    }
  },

  /* демо для автотеста: сам двигается и стреляет */
  demo: false,
  _demoT: 0,

  applyDemo(dt) {
    if (!this.demo) return;
    this._demoT += dt;
    Ctrl.moveX = Math.sin(this._demoT * 0.8);
    Ctrl.run = Math.abs(Ctrl.moveX) > 0.7;
    Ctrl.fire = true;
    Ctrl.jumpDown = (this._demoT % 2.2) < 0.02;
    Ctrl.jumpHeld = false;
    const p = this.player, z = this.nearestEnemyTo(p.x, p.y, 1200, 'e');
    if (z) {
      const a = Math.atan2((z.y + z.h / 2) - (p.y + p.h * 0.58), (z.x + z.w / 2) - (p.x + p.w / 2));
      Ctrl.aim.x = Math.cos(a); Ctrl.aim.y = Math.sin(a);
      Ctrl.useStick = true;
    }
  },

  /* ================================================================ обновление */
  update(dt) {
    G2.dt = dt;
    const L = this.L;
    this.applyDemo(dt);

    if (this.state === 'menu' || this.state === 'over') { G2.uiMode = true; this.handleClick(); return; }
    if (this.state === 'pause') { G2.uiMode = true; this.handleClick(); return; }
    if (this.state === 'shop') { G2.uiMode = true; this.handleClick(); this.shopScrollKeys(dt); return; }
    G2.uiMode = false;
    UI.mouseOverUI = !!UI.hit(G2.mouse.x, G2.mouse.y);

    /* --- игра --- */
    this.updatePlayer(dt);
    Weap.update(this, dt);
    this.reloading = this.weap.reloadT > 0;

    const wantFire = Ctrl.fire && !this.player.dead && !UI.mouseOverUI;
    Weap.tick(this, dt, wantFire, Ctrl.alt);
    this.playerShield = this.player.shieldOn > 0;
    if (this.playerShield) this.player.shieldOn -= dt;

    BULLETS.update(dt, this);
    this.updateCoins(dt);
    this.updateAcids(dt);

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const z = this.enemies[i];
      if (z.dummy) continue;
      Enemies.update(this, z, dt);
      if (z.dead) { this.enemies.splice(i, 1); }
      for (let j = this.enemies.length - 1; j > i; j--) {
        const o = this.enemies[j];
        if (o.dummy || z.dummy) continue;
        if (Math.abs(o.x - z.x) < 12 && Math.abs(o.y - z.y) < 22) {
          const push = sign(z.x - o.x) * 22 * dt;
          z.x += push * 0.5; o.x -= push * 0.5;
        }
      }
    }

    /* цели автонаведения (телефон) */
    if (G2.autoAim && !Ctrl.useStick && G2.isMobile) {
      const t = this.nearestEnemyTo(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 400, 'e');
      if (t) {
        const dx = (t.x + t.w / 2) - (this.player.x + this.player.w / 2);
        const dy = (t.y + t.h / 2) - (this.player.y + this.player.h / 2);
        const a = Math.atan2(dy, dx);
        const ca = Math.atan2(this.player.aimY, this.player.aimX);
        let da = a - ca; while (da > Math.PI) da -= 6.2832; while (da < -Math.PI) da += 6.2832;
        const na = ca + clamp(da, -6 * dt, 6 * dt);
        this.player.aimX = Math.cos(na); this.player.aimY = Math.sin(na);
      }
    }

    FX.update(dt);
    DEST.step();
    this.updateBooms(dt);
    if (this.recoil > 0) this.recoil = Math.max(0, this.recoil - dt * 4);
    this.player.hurtFlash = Math.max(0, this.player.hurtFlash - dt * 3);
    for (let i = this.feed.length - 1; i >= 0; i--) { this.feed[i].t -= dt; if (this.feed[i].t <= 0) this.feed.splice(i, 1); }

    /* волны */
    if (this.mode !== 'range') this.updateWaves(dt);

    /* камера */
    const p = this.player;
    const tx = clamp(p.x + p.w / 2 + p.face * 40, G2.vw / 2, Math.max(G2.vw / 2, L.w - G2.vw / 2));
    const ty = clamp(p.y + p.h / 2 - 14, G2.vh / 2, Math.max(G2.vh / 2, L.h - G2.vh / 2));
    Cam.follow(tx, ty, dt);

    this.handleClick();
    Store2.data.playtime += dt;
  },

  updatePlayer(dt) {
    const p = this.player, L = this.L;
    if (p.dead) { p.vx = 0; return; }
    const frozen = p.frozen > 0;
    if (frozen) p.frozen -= dt;
    if (p.invuln > 0) p.invuln -= dt;

    const spd = (Ctrl.run ? CFG2.RUN : CFG2.WALK) * (frozen ? 0.35 : 1);
    const target = Ctrl.moveX * spd * (Ctrl.crouch ? CFG2.CROUCH_MUL : 1);
    p.vx = approach(p.vx, target, 1400 * dt);
    if (Ctrl.jumpDown && p.onGround && !frozen) { p.vy = -CFG2.JUMP_V; p.onGround = false; Audio3D_SFX.step(p.x, 0, 0); }

    p.vy = Math.min(p.vy + CFG2.GRAV * dt, CFG2.MAX_FALL);
    const res = moveBody(p, p.vx * dt, p.vy * dt, L, true);
    if (res.ground) { p.onGround = true; if (!this._wasGround && p.vy > 240) FX.dust(p.x + p.w / 2, p.y + p.h, 5, 0); }
    p.onGround = res.ground ? true : (res.hitY ? false : p.onGround && Math.abs(p.vy) < 40);
    if (res.hitY) p.vy = 0;
    this._wasGround = res.ground;

    /* шаги */
    if (p.onGround && Math.abs(p.vx) > 30) {
      this._stepT = (this._stepT || 0) + dt * Math.abs(p.vx) * 0.012;
      if (this._stepT > 1) { this._stepT = 0; Audio3D_SFX.step(p.x, 0, 0); if (Ctrl.run) FX.dust(p.x + p.w / 2, p.y + p.h, 2, -sign(p.vx)); }
    }
    p.walk += Math.abs(p.vx) * dt * 0.075;
    if (Math.abs(p.vx) > 4) p.face = p.vx > 0 ? 1 : -1;
    p.x = clamp(p.x, 2, L.w - p.w - 2);

    /* падение за карту */
    if (p.y > L.h + 120) { this.hurtPlayer(35, p.x, p.y - 40); p.y = -60; p.vy = 0; }

    /* опасные зоны */
    const hz = pointHazard(L, p.x + p.w / 2, p.y + p.h - 2);
    if (hz) {
      if (hz.kind === 'acid') { this.hurtPlayer(18 * dt * 3, p.x, p.y, true); }
      else if (hz.kind === 'lava') { this.hurtPlayer(40 * dt * 3, p.x, p.y, true); }
      else if (hz.kind === 'spike') { this.hurtPlayer(30 * dt * 3, p.x, p.y, true); }
      else if (hz.kind === 'pit') { this.hurtPlayer(60, p.x, p.y); p.y = -60; p.vy = 0; }
    }
    if (hz && hz.kind === 'pit') { /* уже обработано */ }

    /* прицел */
    if (Ctrl.useStick) { p.aimX = Ctrl.aim.x; p.aimY = Ctrl.aim.y; }
    else {
      const wx = Cam.left() + G2.mouse.x, wy = Cam.top() + G2.mouse.y;
      p.aimX = wx - (p.x + p.w / 2); p.aimY = wy - (p.y + p.h * 0.58);
    }
    const al = Math.hypot(p.aimX, p.aimY) || 1;
    p.aimX /= al; p.aimY /= al;
    if (!Ctrl.useStick && Math.abs(p.aimX) > 0.3) p.face = p.aimX > 0 ? 1 : -1;

    Audio3D_SFX.setListener(p.x, 0, 0, Math.abs(p.vx) > 20 ? sign(p.vx) : 0, 0);
  },

  updateCoins(dt) {
    const p = this.player;
    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.vy += 1400 * dt;
      const d = Math.hypot((p.x + p.w / 2) - c.x, (p.y + p.h / 2) - c.y);
      if (d < 90) { c.x += ((p.x + p.w / 2) - c.x) * dt * 7; c.y += ((p.y + p.h / 2) - c.y) * dt * 7; c.vy *= 0.6; }
      c.x += c.vx * dt; c.y += c.vy * dt;
      const g = FX._ground(c.x, c.y);
      if (g && c.y > g) { c.y = g; c.vy = 0; c.vx *= 0.7; }
      c.t -= dt;
      if (d < 16 || c.t <= 0) {
        if (d < 16) { p.money = Math.min(CFG.moneyCap || 9999999, p.money + c.v); Audio3D_SFX.pickup(c.x, 0, 0); FX.num(c.x, c.y - 6, c.v, '#6de06d'); }
        this.coins.splice(i, 1);
      }
    }
  },

  updateAcids(dt) {
    for (let i = this.acids.length - 1; i >= 0; i--) {
      const a = this.acids[i];
      a.life -= dt;
      if (a.life <= 0) { this.acids.splice(i, 1); continue; }
      for (const z of this.enemies) {
        if (z.dead || z.dummy) continue;
        if (Math.hypot((z.x + z.w / 2) - a.x, (z.y + z.h / 2) - a.y) < a.r) {
          z.hp -= a.dps * dt; z.burn = Math.max(z.burn, 0.5);
          if (z.hp <= 0) this.killEnemy(z, 'acid');
        }
      }
      if (Math.random() < 0.4) FX.spawn(a.x + rnd(-a.r, a.r), a.y - 2, rnd(-10, 10), -rnd(5, 20), 0.4, '#8ce03c', 2, -20);
    }
  },

  addAcidPool(x, y, r, dps, life) {
    this.acids.push({ x, y, r: r || 38, dps: dps || 55, life: life || 6.5, max: life || 6.5 });
  },

  /* ================================================================ волны */
  updateWaves(dt) {
    const L = this.L;
    if (this.waveState === 'inter') {
      this.interT -= dt;
      if (this.interT <= 0) this.beginWave();
      return;
    }
    if (this.waveState === 'run') {
      const alive = this.enemies.filter(e => !e.dead).length;
      if (alive === 0 && this._spawnLeft <= 0) { this.endWave(); }
      else if (this._spawnLeft > 0 && alive < 34 && (this._spawnT = (this._spawnT || 0) - dt) <= 0) {
        this._spawnT = rnd(0.35, 1.1);
        this._spawnLeft--;
        this.spawnFromEdge();
      }
    }
  },

  beginWave() {
    this.wave++;
    this.waveState = 'run';
    const w = this.wave;
    this.diffHp = 1 + w * 0.09;
    this.diffSpeed = 1 + w * 0.012;
    this.diffDmg = 1 + w * 0.035;

    const pool = ['walker', 'walker'];
    if (w >= 2) pool.push('runner');
    if (w >= 3) pool.push('crawler');
    if (w >= 4) pool.push('spitter');
    if (w >= 5) pool.push('tank');
    if (w >= 7) pool.push('splitter');
    if (w >= 7) pool.push('flying');
    if (w >= 9) pool.push('shielder');
    if (w >= 10) pool.push('healer');
    if (w >= 11) pool.push('bomber');
    if (w >= 13) pool.push('summoner');
    if (w >= 8) pool.push('robot');
    const bossWave = w % 5 === 0;
    if (w >= 25) pool.push('brainBoss');

    let count = Math.min(46, 6 + Math.round(w * 2.1));
    this._spawnPool = pool;
    this._spawnLeft = count;
    this._spawnT = 0;

    if (bossWave) {
